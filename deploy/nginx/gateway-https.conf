# STAY HTTPS gateway for a public IP certificate.
# Installed by deploy/enable-ip-https.sh after a certificate has been issued.

server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/STAY_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/STAY_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Detailed runtime/admin state remains private.
    location ^~ /runtime/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
