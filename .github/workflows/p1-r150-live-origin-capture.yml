name: R150 read-only live origin capture
run-name: R150 origin capture · ${{ inputs.stage }} · ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Resident whose exact live parent is captured
        required: true
        type: choice
        options:
          - homeos
          - intero
      authorization:
        description: Exact read-only capture authorization
        required: true
        type: choice
        default: NO
        options:
          - NO
          - AUTHORIZE_R150_READ_ONLY_ORIGIN_CAPTURE_V1

permissions:
  contents: read

concurrency:
  group: stay-r150-origin-capture
  cancel-in-progress: false

env:
  SOURCE_RELEASE: /opt/stay/releases/0.8.11.3-p1m-r141-metab-shadow-recovery-6a1e6a9ffbfd
  TARGET_RELEASE: /opt/stay/releases/0.8.11.3-p1r0-r150-homeos-intero-c1651b9150bc
  WRAPPER_SHA256: 6f948c132325352469a51b1248d53292d98f7cdaad32c6a26d31aabbebcc1f64
  PUBLIC_KEY_SHA256: f02405d0f62529c35f34c43c0a349f88c7906aa460ce36111585577b119457dc
  PRODUCTION_PUBLIC_IPV4: 35.157.242.167
  PRODUCTION_PRIVATE_IPV4: 172.26.9.207
  PRODUCTION_SSH_ED25519_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBvxednOQ0VcQL1KR0MewyXFCqufbwWsg0Lkgg/MwMUS
  PRODUCTION_SSH_ED25519_FINGERPRINT: SHA256:z0aBq4eHfQpARjsa7pfpL2spIVi62lqwx54mlm9XU8Q

jobs:
  capture:
    name: Capture immutable identity and parent freeze without mutation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout exact dispatch revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate exact read-only request
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$AUTHORIZATION" == AUTHORIZE_R150_READ_ONLY_ORIGIN_CAPTURE_V1 ]]
          [[ "$STAGE" == homeos || "$STAGE" == intero ]]
          node --test --test-concurrency=1 test/p1-r150-controller.test.js
      - name: Prepare pinned production SSH identity
        shell: bash
        env:
          STAY_DEPLOY_KEY: ${{ secrets.STAY_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$STAY_DEPLOY_KEY" > ~/.ssh/stay_deploy
          chmod 0600 ~/.ssh/stay_deploy
          printf '%s %s\n' "$PRODUCTION_PUBLIC_IPV4" "$PRODUCTION_SSH_ED25519_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          [[ "$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')" == "$PRODUCTION_SSH_ED25519_FINGERPRINT" ]]
      - name: Capture and prove exact live parent through read-only entry paths
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          install -d -m 0700 capture
          ssh_options=(-i ~/.ssh/stay_deploy -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" staydeploy@"$PRODUCTION_PUBLIC_IPV4" \
            /usr/local/bin/node - "$STAGE" "$PRODUCTION_PRIVATE_IPV4" "$SOURCE_RELEASE" \
            "$TARGET_RELEASE" "$WRAPPER_SHA256" "$PUBLIC_KEY_SHA256" > capture/origin-capture.json <<'NODE'
          'use strict';
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const { execFileSync, spawnSync } = require('node:child_process');
          const { DatabaseSync } = require('node:sqlite');
          const [stage, expectedIp, sourceRelease, targetRelease, wrapperSha, publicKeySha] = process.argv.slice(2);
          const expected = stage === 'homeos'
            ? { release: sourceRelease, revision: 141, label: 'R141F', freeze: '/var/lib/stay/evidence/runtime-freezes/R141.json' }
            : { release: targetRelease, revision: 145, label: 'R145F', freeze: '/var/lib/stay/evidence/runtime-freezes/R145.json' };
          if (!['homeos', 'intero'].includes(stage)) process.exit(64);
          const hash = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const readSafe = file => {
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink()) throw new Error(`unsafe file ${file}`);
            return fs.readFileSync(file);
          };
          const command = (file, args) => execFileSync(file, args, { encoding: 'utf8', maxBuffer: 16 * 1024 * 1024 }).trim();
          const property = name => command('/usr/bin/systemctl', ['show', 'stay.service', '-p', name, '--value']);
          const before = { pid: property('MainPID'), restarts: property('NRestarts') };
          const observedIp = command('/usr/sbin/ip', ['-o', '-4', 'addr', 'show', 'scope', 'global'])
            .split('\n').map(line => line.trim().split(/\s+/)[3].split('/')[0]).sort().join('\n');
          if (observedIp !== expectedIp || fs.realpathSync('/opt/stay/current') !== expected.release) process.exit(65);
          if (property('ActiveState') !== 'active' || property('SubState') !== 'running' ||
              property('User') !== 'staydeploy' || property('Group') !== 'staydeploy') process.exit(66);
          if (hash(readSafe('/usr/local/sbin/stay-p1-production-controller')) !== wrapperSha ||
              hash(readSafe('/etc/stay/p1-r0-expansion-birth-authority.pub')) !== publicKeySha) process.exit(67);
          const databaseFile = '/var/lib/stay/data/continuity.sqlite3';
          const db = new DatabaseSync(databaseFile, { open: true, readOnly: true });
          let database;
          try {
            db.exec('PRAGMA query_only=ON; BEGIN');
            const metadata = key => {
              const row = db.prepare('SELECT json,sha256 FROM metadata WHERE key=?').get(key);
              if (!row || hash(row.json) !== row.sha256) throw new Error(`invalid metadata ${key}`);
              return JSON.parse(row.json);
            };
            const count = (table, where = '1=1') => Number(db.prepare(`SELECT COUNT(*) value FROM ${table} WHERE ${where}`).get().value);
            const residents = db.prepare(`SELECT residency_id,instance_id,version,status,checkpoint_generation
              FROM resident_instances ORDER BY residency_id`).all();
            database = {
              quickCheck: String(db.prepare('PRAGMA quick_check').get()?.quick_check || '').toLowerCase(),
              identity: metadata('life:identity'), runtimeRevision: Number(metadata('life:runtime-revision').revision),
              residents, pendingDeliveries: count('biological_deliveries', "status='PENDING'"),
              failedDeliveries: count('biological_deliveries', "status='FAILED'"),
              pendingOutboxIntents: count('biological_outbox_intents', "status='PENDING'"),
              p1Authority: count('authority', "core_id IN ('sntss','chronobiology','METAB','HOMEOS','INTERO')"),
              interoOutputs: count('biological_outbox_intents', "producer_core_id='INTERO'")
            };
            db.exec('COMMIT');
          } catch (error) {
            try { db.exec('ROLLBACK'); } catch {}
            throw error;
          } finally { db.close(); }
          const freeze = JSON.parse(readSafe(expected.freeze));
          const { validateRevisionFreeze } = require(`${expected.release}/runtime/revision-freeze`);
          const meta = JSON.parse(command('/usr/bin/curl', ['--fail', '--silent', '--max-time', '3', 'http://127.0.0.1:8787/__stay/meta']));
          const client = `${expected.release}/deploy/live-physiology-transplant/p1-resident-control-client.js`;
          const ids = stage === 'homeos' ? ['sntss', 'chronobiology', 'metab'] : ['sntss', 'chronobiology', 'metab', 'homeos'];
          const statuses = Object.fromEntries(ids.map(id => [id, JSON.parse(command('/usr/local/bin/node', [client, 'status', `resident:${id}`])).resident]));
          const chip = id => meta.chipProjection?.lifecycle?.find(value => value.coreId === id);
          const contained = (id, version, mode) => {
            const value = statuses[id], policy = value?.host?.resourceGovernor?.policy;
            return value?.status === 'RUNNING' && value.running === true && value.version === version &&
              value.authorityOwned === false && value.health?.ok === true && (mode === undefined || value.health?.mode === mode) &&
              value.host?.quarantined === false && value.host?.osContainment?.payloadSandboxed === true &&
              value.host?.osContainment?.payloadAttachedBeforeInit === true && policy?.hardRamBytes === 100663296 &&
              policy?.handlerTimeoutMs === 250 && policy?.pidsMax === 16;
          };
          const fetus = meta.cores?.find(value => value.id === 'fetus-legacy');
          const common = database.quickCheck === 'ok' && database.runtimeRevision === expected.revision &&
            database.pendingDeliveries === 0 && database.failedDeliveries === 0 && database.pendingOutboxIntents === 0 &&
            database.p1Authority === 0 && database.interoOutputs === 0 && validateRevisionFreeze(freeze, expected.revision) &&
            meta.ok === true && meta.revision === expected.revision && meta.revisionFrozen === true &&
            meta.revisionLabel === expected.label && chip('bsf')?.state === 'LIVE' && chip('sntss')?.state === 'SHADOW' &&
            chip('chronobiology')?.state === 'SHADOW' && contained('sntss', '0.5.0-i4g1') &&
            contained('chronobiology', '1.0.0-c3rc.5', 'NEUTRAL') && fetus?.ok === true &&
            fetus?.version === '0.6.0' && fetus?.memoryGuardian?.status === 'healthy';
          const stageOk = stage === 'homeos'
            ? contained('metab', '0.2.0-p1r0-shadow.1', 'SHADOW') && chip('metab')?.state === 'SHADOW' &&
              !database.residents.some(value => ['resident:homeos', 'resident:intero'].includes(value.residency_id))
            : contained('metab', '0.3.0-p1r0-homeos-feed.1', 'SHADOW') &&
              contained('homeos', '0.2.0-p1r0-shadow.1', 'SHADOW') && chip('metab')?.state === 'SHADOW' &&
              chip('homeos')?.state === 'SHADOW' && !database.residents.some(value => value.residency_id === 'resident:intero');
          const benchmark = spawnSync('/usr/bin/systemctl', ['is-active', 'stay-physiology-benchmark-v3.service'], { encoding: 'utf8' });
          const after = { pid: property('MainPID'), restarts: property('NRestarts') };
          if (!(common && stageOk && benchmark.stdout.trim() === 'inactive' && before.pid === after.pid &&
              before.restarts === after.restarts && Number(before.pid) > 0)) process.exit(68);
          const stable = value => Array.isArray(value) ? `[${value.map(stable).join(',')}]` :
            value && typeof value === 'object' ? `{${Object.keys(value).sort().map(key => `${JSON.stringify(key)}:${stable(value[key])}`).join(',')}}` : JSON.stringify(value);
          process.stdout.write(`${stable({ format: 'stay-r150-read-only-live-origin-capture-v1', result: 'PASS', stage,
            capturedAt: new Date().toISOString(), currentRelease: expected.release, runtimeRevision: expected.revision,
            service: { pid: Number(before.pid), restarts: Number(before.restarts) }, identity: database.identity,
            parentFreeze: freeze, parentFreezeSha256: `sha256:${hash(stable(freeze))}`,
            continuity: { residents: database.residents, pendingDeliveries: 0, pendingOutboxIntents: 0,
              p1Authority: 0, fetusHealthy: true, benchmarkActive: false } })}\n`);
          NODE
      - name: Independently validate and split capture
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          node - "$STAGE" capture/origin-capture.json <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const [stage, file] = process.argv.slice(2);
          const capture = JSON.parse(fs.readFileSync(file, 'utf8'));
          const expected = stage === 'homeos' ? 141 : 145;
          const { validateRevisionFreeze } = require('./runtime/revision-freeze');
          if (!(capture.format === 'stay-r150-read-only-live-origin-capture-v1' && capture.result === 'PASS' &&
              capture.stage === stage && capture.runtimeRevision === expected &&
              validateRevisionFreeze(capture.parentFreeze, expected) && capture.identity?.lineage === 'STAY/Genesis' &&
              capture.continuity?.p1Authority === 0 && capture.continuity?.benchmarkActive === false)) process.exit(1);
          fs.writeFileSync('capture/identity.json', `${JSON.stringify(capture.identity)}\n`, { flag: 'wx', mode: 0o600 });
          fs.writeFileSync(`capture/R${expected}.json`, `${JSON.stringify(capture.parentFreeze)}\n`, { flag: 'wx', mode: 0o600 });
          process.stdout.write(`R150_ORIGIN_CAPTURE=PASS\nSTAGE=${stage}\nPARENT_REVISION=R${expected}F\nSERVICE_PID=${capture.service.pid}\nBENCHMARK_ACTIVE=NO\n`);
          NODE
      - name: Upload read-only origin evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r150-${{ inputs.stage }}-origin-capture-${{ github.run_id }}
          path: capture/
          if-no-files-found: error
          retention-days: 3
