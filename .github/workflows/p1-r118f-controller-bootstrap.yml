name: R118F V8 privileged controller bootstrap
run-name: R118F V8 controller bootstrap · ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Exact one-shot controller bootstrap authorization
        required: true
        type: choice
        default: NO
        options:
          - NO
          - AUTHORIZE_R118F_V8_PINNED_CONTROLLER_BOOTSTRAP

permissions:
  contents: read

concurrency:
  group: stay-r118f-v8-controller-bootstrap
  cancel-in-progress: false

env:
  WRAPPER_SHA256: 04fefb41ad18f68d25459b7b2acb977e1dc94f38cb10704bb01cfb7ec877570e
  INSTALLER_SHA256: f69987772910cc67be8447b0482b7ab65656cc6ce76d18dfcc50f030aadf5e59
  PRODUCTION_PUBLIC_IPV4: 35.157.242.167
  PRODUCTION_PRIVATE_IPV4: 172.26.9.207
  PRODUCTION_SSH_ED25519_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBvxednOQ0VcQL1KR0MewyXFCqufbwWsg0Lkgg/MwMUS
  PRODUCTION_SSH_ED25519_FINGERPRINT: SHA256:z0aBq4eHfQpARjsa7pfpL2spIVi62lqwx54mlm9XU8Q

jobs:
  validate-and-seal:
    name: Validate and seal controller without production credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact dispatch revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate source and fixed controller contract
        shell: bash
        env:
          REQUESTED_AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$REQUESTED_AUTHORIZATION" == AUTHORIZE_R118F_V8_PINNED_CONTROLLER_BOOTSTRAP ]]
          wrapper='deploy/live-physiology-transplant/stay-p1-r118f-production-controller'
          installer='deploy/live-physiology-transplant/install-p1-r118f-production-controller.sh'
          [[ "$(sha256sum "$wrapper" | awk '{print $1}')" == "$WRAPPER_SHA256" ]]
          [[ "$(sha256sum "$installer" | awk '{print $1}')" == "$INSTALLER_SHA256" ]]
          bash -n "$wrapper"
          bash -n "$installer"
          node --test --test-concurrency=1 test/p1-r118f-controller.test.js
          operations="$(sed -n '/case "$operation" in/,/esac/p' "$wrapper" |
            sed -n 's/^    \([^*][^)]*\))$/\1/p')"
          [[ "$operations" == $'harden-r118f\nrecover-r118f' ]]
          grep -Fx 'staydeploy ALL=(root) NOPASSWD: /usr/local/sbin/stay-p1-production-controller' <(
            sed -n "/<<'SUDOERS'/,/^SUDOERS$/p" "$installer" | sed '1d;$d'
          )
      - name: Seal bootstrap artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/r118f-v8-controller-bootstrap"
          install -d -m 0700 "$artifact"
          install -m 0555 deploy/live-physiology-transplant/stay-p1-r118f-production-controller \
            "$artifact/stay-p1-r118f-production-controller"
          install -m 0555 deploy/live-physiology-transplant/install-p1-r118f-production-controller.sh \
            "$artifact/install-p1-r118f-production-controller.sh"
          (cd "$artifact" && sha256sum \
            stay-p1-r118f-production-controller \
            install-p1-r118f-production-controller.sh > P1_R118F_V8_CONTROLLER_BOOTSTRAP.sha256)
      - name: Upload sealed bootstrap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r118f-v8-controller-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/r118f-v8-controller-bootstrap/
          if-no-files-found: error
          retention-days: 7

  stage-and-await-root-bridge:
    name: Stage controller and await out-of-band root bridge
    needs: validate-and-seal
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    steps:
      - name: Download isolated sealed artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: r118f-v8-controller-bootstrap-${{ github.run_id }}
          path: bootstrap-artifact
      - name: Verify artifact before credentials
        shell: bash
        run: |
          set -euo pipefail
          expected=$'P1_R118F_V8_CONTROLLER_BOOTSTRAP.sha256\ninstall-p1-r118f-production-controller.sh\nstay-p1-r118f-production-controller'
          [[ "$(find bootstrap-artifact -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)" == "$expected" ]]
          (cd bootstrap-artifact && sha256sum -c P1_R118F_V8_CONTROLLER_BOOTSTRAP.sha256)
          [[ "$(sha256sum bootstrap-artifact/stay-p1-r118f-production-controller | awk '{print $1}')" == "$WRAPPER_SHA256" ]]
          [[ "$(sha256sum bootstrap-artifact/install-p1-r118f-production-controller.sh | awk '{print $1}')" == "$INSTALLER_SHA256" ]]
      - name: Prepare pinned production SSH identity
        shell: bash
        env:
          STAY_DEPLOY_KEY: ${{ secrets.STAY_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$STAY_DEPLOY_KEY" > ~/.ssh/stay_deploy
          chmod 0600 ~/.ssh/stay_deploy
          printf '%s %s\n' "$PRODUCTION_PUBLIC_IPV4" "$PRODUCTION_SSH_ED25519_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          [[ "$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')" == "$PRODUCTION_SSH_ED25519_FINGERPRINT" ]]
      - name: Stage exact controller and publish root bridge
        shell: bash
        run: |
          set -euo pipefail
          run_root="/opt/stay/incoming/r118f-controller-v8-${GITHUB_RUN_ID}"
          echo "RUN_ROOT=$run_root" >> "$GITHUB_ENV"
          ssh_options=(-i ~/.ssh/stay_deploy -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" staydeploy@"$PRODUCTION_PUBLIC_IPV4" \
            "set -euo pipefail; observed=\$(ip -o -4 addr show scope global | awk '{a=\$4;sub(/\\/.*/,\"\",a);print a}' | sort -u); [[ \"\$observed\" == '$PRODUCTION_PRIVATE_IPV4' ]]; test ! -e '$run_root'; install -d -m 0700 '$run_root'"
          scp "${ssh_options[@]}" \
            bootstrap-artifact/stay-p1-r118f-production-controller \
            bootstrap-artifact/install-p1-r118f-production-controller.sh \
            bootstrap-artifact/P1_R118F_V8_CONTROLLER_BOOTSTRAP.sha256 \
            staydeploy@"$PRODUCTION_PUBLIC_IPV4":"$run_root/"
          ssh "${ssh_options[@]}" staydeploy@"$PRODUCTION_PUBLIC_IPV4" 'bash -s' -- \
            "$run_root" "$WRAPPER_SHA256" "$INSTALLER_SHA256" <<'REMOTE'
          set -Eeuo pipefail
          root="$1"; wrapper_sha="$2"; installer_sha="$3"
          [[ "$root" =~ ^/opt/stay/incoming/r118f-controller-v8-[0-9]+$ && -d "$root" && ! -L "$root" ]]
          [[ "$(stat -Lc '%U:%G' "$root")" == staydeploy:staydeploy ]]
          [[ -z "$(find -P "$root" -xdev \( -type l -o -type f -links +1 -o ! -type d ! -type f \) -print -quit)" ]]
          (cd "$root" && sha256sum -c P1_R118F_V8_CONTROLLER_BOOTSTRAP.sha256)
          [[ "$(sha256sum "$root/stay-p1-r118f-production-controller" | awk '{print $1}')" == "$wrapper_sha" ]]
          [[ "$(sha256sum "$root/install-p1-r118f-production-controller.sh" | awk '{print $1}')" == "$installer_sha" ]]
          find -P "$root" -xdev -type f -exec chmod 0400 {} +
          echo 'R118F_V8_CONTROLLER_STAGE=PASS'
          REMOTE
          bridge="sudo /bin/bash -c 'set -Eeuo pipefail; root=\"\$1\"; wrapper_sha=\"\$2\"; installer_sha=\"\$3\"; [[ \"\$root\" =~ ^/opt/stay/incoming/r118f-controller-v8-[0-9]+\$ && -d \"\$root\" && ! -L \"\$root\" ]]; [[ \"\$(sha256sum \"\$root/stay-p1-r118f-production-controller\" | awk '\"'\"'{print \$1}'\"'\"')\" == \"\$wrapper_sha\" ]]; [[ \"\$(sha256sum \"\$root/install-p1-r118f-production-controller.sh\" | awk '\"'\"'{print \$1}'\"'\"')\" == \"\$installer_sha\" ]]; private=\$(mktemp -d /run/stay-r118f-v8-bootstrap.XXXXXX); trap '\"'\"'rm -rf -- \"\$private\"'\"'\"' EXIT; install -o root -g root -m 0555 \"\$root/stay-p1-r118f-production-controller\" \"\$private/stay-p1-r118f-production-controller\"; install -o root -g root -m 0555 \"\$root/install-p1-r118f-production-controller.sh\" \"\$private/install-p1-r118f-production-controller.sh\"; [[ \"\$(sha256sum \"\$private/stay-p1-r118f-production-controller\" | awk '\"'\"'{print \$1}'\"'\"')\" == \"\$wrapper_sha\" ]]; [[ \"\$(sha256sum \"\$private/install-p1-r118f-production-controller.sh\" | awk '\"'\"'{print \$1}'\"'\"')\" == \"\$installer_sha\" ]]; /bin/bash \"\$private/install-p1-r118f-production-controller.sh\"' _ '$run_root' '$WRAPPER_SHA256' '$INSTALLER_SHA256'"
          echo "MANUAL_ROOT_BRIDGE_COMMAND=$bridge"
          {
            echo '### R118F V8 root bridge required'
            echo
            echo 'Run this exact command in the production console:'
            echo
            echo '```bash'
            echo "$bridge"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Await exact installed controller
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-i ~/.ssh/stay_deploy -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          installed=NO
          for _ in $(seq 1 90); do
            observed="$(ssh "${ssh_options[@]}" staydeploy@"$PRODUCTION_PUBLIC_IPV4" \
              "sha256sum /usr/local/sbin/stay-p1-production-controller 2>/dev/null | awk '{print \$1}'" || true)"
            if [[ "$observed" == "$WRAPPER_SHA256" ]]; then installed=YES; break; fi
            sleep 30
          done
          [[ "$installed" == YES ]]
          echo 'R118F_V8_CONTROLLER_INSTALLED=PASS'
