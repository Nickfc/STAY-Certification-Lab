name: Certify exact R124 METAB-neutral candidate

on:
  push:
    branches:
      - certification/r124-metab-neutral-1016f6f

permissions:
  contents: read

env:
  CERTIFIED_SHA: 1016f6faf0ae0f6bcb722748b19bbffdd5a5b336

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 1016f6faf0ae0f6bcb722748b19bbffdd5a5b336
          fetch-depth: 0
      - name: Verify candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
          test -z "$(git status --porcelain)"
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install required OS sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo tee /usr/local/bin/stay-ci-bwrap >/dev/null <<'EOF'
          #!/bin/sh
          exec sudo -n /usr/bin/bwrap "$@"
          EOF
          sudo chown root:root /usr/local/bin/stay-ci-bwrap
          sudo chmod 0755 /usr/local/bin/stay-ci-bwrap
          sudo -n true
          test -x /usr/local/bin/stay-ci-bwrap
      - name: Prepare sandbox-readable immutable tree
        run: |
          git clone --no-hardlinks "$GITHUB_WORKSPACE" /tmp/stay-ci-source
          test "$(git -C /tmp/stay-ci-source rev-parse HEAD)" = "$CERTIFIED_SHA"
          test -z "$(git -C /tmp/stay-ci-source status --porcelain)"
          find /tmp/stay-ci-source -type d -exec chmod a+rx {} +
      - name: Run focused R124 regression gate
        working-directory: /tmp/stay-ci-source
        env:
          STAY_BWRAP: /usr/local/bin/stay-ci-bwrap
        run: >-
          node --test --test-concurrency=1
          test/p1-r124-metab-neutral-birth.test.js
          test/p1-r0-persistence.test.js
          test/p1-r0-resident-packages.test.js
          test/p1-r0-roadmap.test.js
      - name: Run real Bubblewrap entry preflight
        working-directory: /tmp/stay-ci-source
        env:
          STAY_BWRAP: /usr/local/bin/stay-ci-bwrap
        run: >-
          node --test --test-concurrency=1
          --test-name-pattern='the real preflight CLI entry passes through Bubblewrap on Linux'
          test/production-hardening-entry-path.test.js
      - name: Run secure server entry preflight
        working-directory: /tmp/stay-ci-source
        env:
          STAY_BWRAP: /usr/local/bin/stay-ci-bwrap
        run: node --test --test-concurrency=1 test/r11-m01-operator-status.test.js
      - name: Run complete STAY suite
        working-directory: /tmp/stay-ci-source
        env:
          STAY_BWRAP: /usr/local/bin/stay-ci-bwrap
        run: npm test
