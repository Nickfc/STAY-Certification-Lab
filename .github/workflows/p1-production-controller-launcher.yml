name: P1 Surgery A/A.1/B production launcher
run-name: P1 ${{ inputs.operation }} · ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed production-controller operation
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - surgery-a
          - rollback-a
          - preflight-a1
          - surgery-a1
          - rollback-a1
          - preflight-a1-entrypoint
          - correct-a1-entrypoint
          - rollback-a1-entrypoint
          - preflight-b0
          - configure-b0
          - complete-b0
          - repair-b0-sandbox
          - complete-b0-sandbox-repair
          - rollback-b0
          - preflight-b
          - surgery-b
          - rollback-b
      surgery_a_authorization:
        description: Required only for surgery-a; enter its exact authorization phrase
        required: false
        type: string
      rollback_a_authorization:
        description: Required only for rollback-a; enter its separate exact authorization phrase
        required: false
        type: string
      surgery_a1_authorization:
        description: Required only for surgery-a1; enter its exact authorization phrase
        required: false
        type: string
      rollback_a1_authorization:
        description: Required only for rollback-a1; enter its separate exact authorization phrase
        required: false
        type: string
      a1_entrypoint_authorization:
        description: Required only for correct-a1-entrypoint; enter its exact authorization phrase
        required: false
        type: string
      a1_entrypoint_rollback_authorization:
        description: Required only for rollback-a1-entrypoint; enter its separate exact authorization phrase
        required: false
        type: string
      b0_configure_authorization:
        description: Required only for configure-b0; enter its exact authorization phrase
        required: false
        type: string
      b0_rollback_authorization:
        description: Required only for rollback-b0; enter its separate exact authorization phrase
        required: false
        type: string
      b0_completion_authorization:
        description: Required only for complete-b0; enter its distinct exact authorization phrase
        required: false
        type: string
      b0_sandbox_repair_authorization:
        description: Required only for repair-b0-sandbox; enter its distinct exact authorization phrase
        required: false
        type: string
      b0_sandbox_repair_completion_authorization:
        description: Required only for complete-b0-sandbox-repair; enter its distinct exact authorization phrase
        required: false
        type: string
      surgery_b_authorization:
        description: Required only for surgery-b; enter its exact authorization phrase
        required: false
        type: string
      rollback_b_authorization:
        description: Required only for rollback-b; enter its separate exact authorization phrase
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: stay-genesis-p1-surgery-a-production
  cancel-in-progress: false

env:
  CONTROLLER_COMMIT: 4eaecbd23fc0165c180bb3fea936333f244eac65
  EXACT_CANDIDATE_SHA: 7d040592ccf1f149f0f0a170f79cf76bb5f05d92
  EXACT_CANDIDATE_TREE: 450cc22f70b7abf3b5733fe882049d88cd52de74
  EXACT_COMPUTE_RECORD_SHA256: sha256:384f3f2e27232b555fe52185c775562d31cf7fac349dfb95ae93968225c83ec1
  CONTROLLER_SOURCE_IDENTITY: sha256:1ae75d99d3e0bc7e7d3a07ea0cff734a6555684e304b0ae1aba102becbe1d89b
  PRODUCTION_PUBLIC_IPV4: 35.157.242.167
  PRODUCTION_PRIVATE_IPV4: 172.26.9.207
  CANDIDATE_ID: 0.8.11.3-p1a-surgery-a-candidate-7d040592ccf1f149f0f0a170f79cf76bb5f05d92
  ROLLBACK_ID: 0.8.11.3-p1a-forward-compatible-rollback-7d040592ccf1f149f0f0a170f79cf76bb5f05d92
  A1_ID: 0.8.11.3-p1a1-resident-control-7d040592ccf1f149

jobs:
  build-test-secret-free:
    name: Build and test exact candidate (secret-free)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate pinned controller and fixed dispatch contract
        shell: bash
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
          SURGERY_AUTHORIZATION: ${{ inputs.surgery_a_authorization }}
          ROLLBACK_AUTHORIZATION: ${{ inputs.rollback_a_authorization }}
          SURGERY_A1_AUTHORIZATION: ${{ inputs.surgery_a1_authorization }}
          ROLLBACK_A1_AUTHORIZATION: ${{ inputs.rollback_a1_authorization }}
          ENTRYPOINT_AUTHORIZATION: ${{ inputs.a1_entrypoint_authorization }}
          ENTRYPOINT_ROLLBACK_AUTHORIZATION: ${{ inputs.a1_entrypoint_rollback_authorization }}
          B0_CONFIGURE_AUTHORIZATION: ${{ inputs.b0_configure_authorization }}
          B0_ROLLBACK_AUTHORIZATION: ${{ inputs.b0_rollback_authorization }}
          B0_COMPLETION_AUTHORIZATION: ${{ inputs.b0_completion_authorization }}
          B0_SANDBOX_REPAIR_AUTHORIZATION: ${{ inputs.b0_sandbox_repair_authorization }}
          B0_SANDBOX_REPAIR_COMPLETION_AUTHORIZATION: ${{ inputs.b0_sandbox_repair_completion_authorization }}
          SURGERY_B_AUTHORIZATION: ${{ inputs.surgery_b_authorization }}
          ROLLBACK_B_AUTHORIZATION: ${{ inputs.rollback_b_authorization }}
        run: |
          set -euo pipefail
          [[ "$CONTROLLER_COMMIT" == "4eaecbd23fc0165c180bb3fea936333f244eac65" ]]
          case "$REQUESTED_OPERATION" in
            preflight)
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            surgery-a)
              [[ "$SURGERY_AUTHORIZATION" == "AUTHORIZE_SURGERY_A_7D040592CCF1F149" ]]
              [[ -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            rollback-a)
              [[ "$ROLLBACK_AUTHORIZATION" == "AUTHORIZE_ROLLBACK_A_FORWARD_STATE_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            preflight-a1)
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            surgery-a1)
              [[ "$SURGERY_A1_AUTHORIZATION" == "AUTHORIZE_SURGERY_A1_RESIDENT_CONTROL_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            rollback-a1)
              [[ "$ROLLBACK_A1_AUTHORIZATION" == "AUTHORIZE_ROLLBACK_A1_FORWARD_STATE_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            preflight-a1-entrypoint)
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            correct-a1-entrypoint)
              [[ "$ENTRYPOINT_AUTHORIZATION" == "AUTHORIZE_A1_ENTRYPOINT_CORRECTION_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            rollback-a1-entrypoint)
              [[ "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" == "AUTHORIZE_A1_ENTRYPOINT_ROLLBACK_NO_STATE_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" ]]
              ;;
            preflight-b0)
              [[ -z "$B0_CONFIGURE_AUTHORIZATION" && -z "$B0_ROLLBACK_AUTHORIZATION" && -z "$SURGERY_B_AUTHORIZATION" && -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            configure-b0)
              [[ "$B0_CONFIGURE_AUTHORIZATION" == "AUTHORIZE_B0_TRUST_RUNTIME_7D040592CCF1F149" ]]
              [[ -z "$B0_ROLLBACK_AUTHORIZATION" && -z "$SURGERY_B_AUTHORIZATION" && -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            complete-b0)
              [[ "$B0_COMPLETION_AUTHORIZATION" == "AUTHORIZE_B0_COMPLETE_EXISTING_RUNTIME_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" && -z "$B0_CONFIGURE_AUTHORIZATION" && -z "$B0_ROLLBACK_AUTHORIZATION" && -z "$B0_SANDBOX_REPAIR_AUTHORIZATION" && -z "$SURGERY_B_AUTHORIZATION" && -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            repair-b0-sandbox)
              [[ "$B0_SANDBOX_REPAIR_AUTHORIZATION" == "AUTHORIZE_B0_SANDBOX_REPAIR_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" && -z "$B0_CONFIGURE_AUTHORIZATION" && -z "$B0_ROLLBACK_AUTHORIZATION" && -z "$B0_COMPLETION_AUTHORIZATION" && -z "$B0_SANDBOX_REPAIR_COMPLETION_AUTHORIZATION" && -z "$SURGERY_B_AUTHORIZATION" && -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            complete-b0-sandbox-repair)
              [[ "$B0_SANDBOX_REPAIR_COMPLETION_AUTHORIZATION" == "AUTHORIZE_B0_SANDBOX_REPAIR_COMPLETION_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" && -z "$B0_CONFIGURE_AUTHORIZATION" && -z "$B0_ROLLBACK_AUTHORIZATION" && -z "$B0_COMPLETION_AUTHORIZATION" && -z "$B0_SANDBOX_REPAIR_AUTHORIZATION" && -z "$SURGERY_B_AUTHORIZATION" && -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            rollback-b0)
              [[ "$B0_ROLLBACK_AUTHORIZATION" == "AUTHORIZE_ROLLBACK_B0_FORWARD_STATE_7D040592CCF1F149" ]]
              [[ -z "$B0_CONFIGURE_AUTHORIZATION" && -z "$SURGERY_B_AUTHORIZATION" && -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            preflight-b)
              [[ -z "$SURGERY_B_AUTHORIZATION" && -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            surgery-b)
              [[ "$SURGERY_B_AUTHORIZATION" == "AUTHORIZE_SURGERY_B_SNTSS_NEUTRAL_7D040592CCF1F149" ]]
              [[ -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            rollback-b)
              [[ "$ROLLBACK_B_AUTHORIZATION" == "AUTHORIZE_ROLLBACK_B_PRESERVE_STATE_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_B_AUTHORIZATION" ]]
              ;;
            *) exit 64 ;;
          esac

      - name: Checkout exact independently certified candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 7d040592ccf1f149f0f0a170f79cf76bb5f05d92
          fetch-depth: 1
          persist-credentials: false
          path: candidate

      - name: Checkout controller revision without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.CONTROLLER_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
          path: controller-source

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Prove source and controller identities
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git -C candidate rev-parse HEAD)" == "$EXACT_CANDIDATE_SHA" ]]
          [[ "$(git -C candidate rev-parse HEAD^{tree})" == "$EXACT_CANDIDATE_TREE" ]]
          [[ "$(git -C controller-source rev-parse HEAD)" == "$CONTROLLER_COMMIT" ]]
          git -C controller-source merge-base --is-ancestor "$EXACT_CANDIDATE_SHA" HEAD
          bash -n controller-source/deploy/live-physiology-transplant/p1-actions-remote-controller.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-surgery-a-execute.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-forward-rollback.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-live-preflight.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-surgery-a1-preflight.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-surgery-a1-execute.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-surgery-a1-rollback.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-a1-entrypoint-preflight.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-a1-entrypoint-correct.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-a1-entrypoint-rollback.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-b0-preflight.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-b0-configure.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-b0-complete.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-b0-sandbox-repair.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-b0-sandbox-repair-complete.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-b0-rollback.sh
          node --check controller-source/deploy/live-physiology-transplant/p1-b0-state.js
          node --check controller-source/deploy/live-physiology-transplant/p1-b0-runtime-ready.js
          node --check controller-source/deploy/live-physiology-transplant/p1-b0-live-user-probe.js
          bash -n controller-source/deploy/live-physiology-transplant/p1-surgery-b-preflight.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-surgery-b-execute.sh
          bash -n controller-source/deploy/live-physiology-transplant/p1-surgery-b-rollback.sh
          node --check controller-source/deploy/live-physiology-transplant/p1-surgery-b-state.js
          bash -n controller-source/deploy/live-physiology-transplant/stay-p1-production-controller
          bash -n controller-source/deploy/live-physiology-transplant/install-p1-production-controller.sh
          node --check controller-source/runtime/kernel/resident-control-socket.js
          node --check controller-source/deploy/live-physiology-transplant/p1-resident-control-client.js
          node --check controller-source/deploy/live-physiology-transplant/p1-surgery-a1-state.js
          node --test --test-concurrency=1 \
            controller-source/test/p1-surgery-a-execution.test.js \
            controller-source/test/p1-actions-production-controller.test.js \
            controller-source/test/p1-privileged-bridge.test.js \
            controller-source/test/p1-resident-control-socket.test.js \
            controller-source/test/p1-surgery-a1.test.js \
            controller-source/test/p1-a1-entrypoint-correction.test.js \
            controller-source/test/p1-surgery-b.test.js \
            controller-source/test/p1-b0-runtime-provisioning.test.js \
            controller-source/test/p1-b0-sandbox-repair.test.js

      - name: Run exact candidate direct and full tests
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 test/p1-surgery-a-transplant.test.js
          npm test

      - name: Build exact immutable Surgery A release pair
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          OUTPUT_ROOT="$RUNNER_TEMP/p1-release-pair"
          node scripts/p1-build-surgery-a.js \
            --source-sha "$EXACT_CANDIDATE_SHA" \
            --source-tree "$EXACT_CANDIDATE_TREE" \
            --output-root "$OUTPUT_ROOT" > "$RUNNER_TEMP/p1-a-build-result.json"
          test -d "$OUTPUT_ROOT/$CANDIDATE_ID"
          test -d "$OUTPUT_ROOT/$ROLLBACK_ID"
          node runtime/release/sntss-release-control.js verify --root "$OUTPUT_ROOT/$CANDIDATE_ID"
          node runtime/release/sntss-release-control.js verify --root "$OUTPUT_ROOT/$ROLLBACK_ID"

      - name: Build immutable A.1 control-plane overlay
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_ROOT="$RUNNER_TEMP/p1-release-pair"
          node controller-source/scripts/p1-build-surgery-a1.js \
            --base-release "$OUTPUT_ROOT/$CANDIDATE_ID" \
            --overlay-root controller-source \
            --output-root "$OUTPUT_ROOT" > "$RUNNER_TEMP/p1-a1-build-result.json"
          test -d "$OUTPUT_ROOT/$A1_ID"
          node candidate/runtime/release/sntss-release-control.js verify --root "$OUTPUT_ROOT/$A1_ID"
          P1_A1_RELEASE_ROOT="$OUTPUT_ROOT/$A1_ID" \
            node --test --test-concurrency=1 \
              controller-source/test/p1-a1-staged-identity-regression.test.js
          jq -s '{surgeryA:.[0], surgeryA1:.[1]}' \
            "$RUNNER_TEMP/p1-a-build-result.json" \
            "$RUNNER_TEMP/p1-a1-build-result.json" > "$RUNNER_TEMP/p1-build-result.json"

      - name: Seal non-executable bridge bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/p1-actions-bundle"
          install -d -m 0700 "$BUNDLE/controller"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP/p1-release-pair" -cf - "$CANDIDATE_ID" "$ROLLBACK_ID" "$A1_ID" |
            gzip -n > "$BUNDLE/p1-surgery-a-releases.tar.gz"
          for script in \
            p1-actions-remote-controller.sh \
            p1-host-identity-guard.sh \
            p1-live-preflight.sh \
            p1-surgery-a-execute.sh \
            p1-forward-rollback.sh \
            p1-surgery-a1-state.js \
            p1-resident-control-client.js \
            p1-surgery-a1-preflight.sh \
            p1-surgery-a1-execute.sh \
            p1-surgery-a1-rollback.sh \
            p1-a1-entrypoint-preflight.sh \
            p1-a1-entrypoint-correct.sh \
            p1-a1-entrypoint-rollback.sh \
            p1-b0-state.js \
            p1-b0-runtime-ready.js \
            p1-b0-preflight.sh \
            p1-b0-configure.sh \
            p1-b0-complete.sh \
            p1-b0-live-user-probe.js \
            p1-b0-sandbox-repair.sh \
            p1-b0-sandbox-repair-complete.sh \
            p1-b0-rollback.sh \
            p1-surgery-b-state.js \
            p1-surgery-b-preflight.sh \
            p1-surgery-b-execute.sh \
            p1-surgery-b-rollback.sh; do
            install -m 0555 \
              "controller-source/deploy/live-physiology-transplant/$script" \
              "$BUNDLE/controller/$script"
          done
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$BUNDLE" -czf "$BUNDLE/p1-actions-controller.tar.gz" controller
          rm -rf "$BUNDLE/controller"
          cp "$RUNNER_TEMP/p1-build-result.json" "$BUNDLE/p1-build-result.json"
          (
            cd "$BUNDLE"
            sha256sum \
              p1-surgery-a-releases.tar.gz \
              p1-actions-controller.tar.gz \
              p1-build-result.json > P1_ACTIONS_BUNDLE.sha256
          )
          printf '%s\n' \
            "EXACT_CANDIDATE_SHA=$EXACT_CANDIDATE_SHA" \
            "EXACT_CANDIDATE_TREE=$EXACT_CANDIDATE_TREE" \
            "EXACT_COMPUTE_RECORD_SHA256=$EXACT_COMPUTE_RECORD_SHA256" \
            "CONTROLLER_SOURCE_IDENTITY=$CONTROLLER_SOURCE_IDENTITY" \
            "CONTROLLER_COMMIT=$CONTROLLER_COMMIT" > "$BUNDLE/P1_ACTIONS_BUNDLE.identity"
          (
            cd "$BUNDLE"
            sha256sum P1_ACTIONS_BUNDLE.identity >> P1_ACTIONS_BUNDLE.sha256
          )

      - name: Upload sealed bridge artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p1-surgery-a-bridge-${{ github.run_id }}
          path: ${{ runner.temp }}/p1-actions-bundle/
          if-no-files-found: error
          retention-days: 7

      # Historical staging-contract markers retained for the exact candidate's
      # hostile-closure assertions: RELEASE_PROVENANCE.json
      # .github runtime cores deploy docs scripts legacy test
      # sntss-release-control.js emit
      # sha256sum "$ARCHIVE"
      # Upload to incoming only
      # "$ARCHIVE" "$ARCHIVE.sha256"

  production-bridge:
    name: Fixed-operation production bridge
    needs: build-test-secret-free
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download isolated sealed artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p1-surgery-a-bridge-${{ github.run_id }}
          path: bridge-bundle

      - name: Validate artifact without executing candidate code
        shell: bash
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
          SURGERY_AUTHORIZATION: ${{ inputs.surgery_a_authorization }}
          ROLLBACK_AUTHORIZATION: ${{ inputs.rollback_a_authorization }}
          SURGERY_A1_AUTHORIZATION: ${{ inputs.surgery_a1_authorization }}
          ROLLBACK_A1_AUTHORIZATION: ${{ inputs.rollback_a1_authorization }}
          ENTRYPOINT_AUTHORIZATION: ${{ inputs.a1_entrypoint_authorization }}
          ENTRYPOINT_ROLLBACK_AUTHORIZATION: ${{ inputs.a1_entrypoint_rollback_authorization }}
          B0_CONFIGURE_AUTHORIZATION: ${{ inputs.b0_configure_authorization }}
          B0_ROLLBACK_AUTHORIZATION: ${{ inputs.b0_rollback_authorization }}
          B0_COMPLETION_AUTHORIZATION: ${{ inputs.b0_completion_authorization }}
          B0_SANDBOX_REPAIR_AUTHORIZATION: ${{ inputs.b0_sandbox_repair_authorization }}
          B0_SANDBOX_REPAIR_COMPLETION_AUTHORIZATION: ${{ inputs.b0_sandbox_repair_completion_authorization }}
          SURGERY_B_AUTHORIZATION: ${{ inputs.surgery_b_authorization }}
          ROLLBACK_B_AUTHORIZATION: ${{ inputs.rollback_b_authorization }}
        run: |
          set -euo pipefail
          case "$REQUESTED_OPERATION" in
            preflight)
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            surgery-a)
              [[ "$SURGERY_AUTHORIZATION" == "AUTHORIZE_SURGERY_A_7D040592CCF1F149" ]]
              [[ -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            rollback-a)
              [[ "$ROLLBACK_AUTHORIZATION" == "AUTHORIZE_ROLLBACK_A_FORWARD_STATE_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            preflight-a1)
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            surgery-a1)
              [[ "$SURGERY_A1_AUTHORIZATION" == "AUTHORIZE_SURGERY_A1_RESIDENT_CONTROL_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            rollback-a1)
              [[ "$ROLLBACK_A1_AUTHORIZATION" == "AUTHORIZE_ROLLBACK_A1_FORWARD_STATE_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            preflight-a1-entrypoint)
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            correct-a1-entrypoint)
              [[ "$ENTRYPOINT_AUTHORIZATION" == "AUTHORIZE_A1_ENTRYPOINT_CORRECTION_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" ]]
              ;;
            rollback-a1-entrypoint)
              [[ "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" == "AUTHORIZE_A1_ENTRYPOINT_ROLLBACK_NO_STATE_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" ]]
              ;;
            preflight-b0)
              [[ -z "$B0_CONFIGURE_AUTHORIZATION" && -z "$B0_ROLLBACK_AUTHORIZATION" && -z "$SURGERY_B_AUTHORIZATION" && -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            configure-b0)
              [[ "$B0_CONFIGURE_AUTHORIZATION" == "AUTHORIZE_B0_TRUST_RUNTIME_7D040592CCF1F149" ]]
              [[ -z "$B0_ROLLBACK_AUTHORIZATION" && -z "$SURGERY_B_AUTHORIZATION" && -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            complete-b0)
              [[ "$B0_COMPLETION_AUTHORIZATION" == "AUTHORIZE_B0_COMPLETE_EXISTING_RUNTIME_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" && -z "$B0_CONFIGURE_AUTHORIZATION" && -z "$B0_ROLLBACK_AUTHORIZATION" && -z "$B0_SANDBOX_REPAIR_AUTHORIZATION" && -z "$SURGERY_B_AUTHORIZATION" && -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            repair-b0-sandbox)
              [[ "$B0_SANDBOX_REPAIR_AUTHORIZATION" == "AUTHORIZE_B0_SANDBOX_REPAIR_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" && -z "$B0_CONFIGURE_AUTHORIZATION" && -z "$B0_ROLLBACK_AUTHORIZATION" && -z "$B0_COMPLETION_AUTHORIZATION" && -z "$B0_SANDBOX_REPAIR_COMPLETION_AUTHORIZATION" && -z "$SURGERY_B_AUTHORIZATION" && -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            complete-b0-sandbox-repair)
              [[ "$B0_SANDBOX_REPAIR_COMPLETION_AUTHORIZATION" == "AUTHORIZE_B0_SANDBOX_REPAIR_COMPLETION_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_AUTHORIZATION" && -z "$ROLLBACK_AUTHORIZATION" && -z "$SURGERY_A1_AUTHORIZATION" && -z "$ROLLBACK_A1_AUTHORIZATION" && -z "$ENTRYPOINT_AUTHORIZATION" && -z "$ENTRYPOINT_ROLLBACK_AUTHORIZATION" && -z "$B0_CONFIGURE_AUTHORIZATION" && -z "$B0_ROLLBACK_AUTHORIZATION" && -z "$B0_COMPLETION_AUTHORIZATION" && -z "$B0_SANDBOX_REPAIR_AUTHORIZATION" && -z "$SURGERY_B_AUTHORIZATION" && -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            rollback-b0)
              [[ "$B0_ROLLBACK_AUTHORIZATION" == "AUTHORIZE_ROLLBACK_B0_FORWARD_STATE_7D040592CCF1F149" ]]
              [[ -z "$B0_CONFIGURE_AUTHORIZATION" && -z "$SURGERY_B_AUTHORIZATION" && -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            preflight-b)
              [[ -z "$SURGERY_B_AUTHORIZATION" && -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            surgery-b)
              [[ "$SURGERY_B_AUTHORIZATION" == "AUTHORIZE_SURGERY_B_SNTSS_NEUTRAL_7D040592CCF1F149" ]]
              [[ -z "$ROLLBACK_B_AUTHORIZATION" ]]
              ;;
            rollback-b)
              [[ "$ROLLBACK_B_AUTHORIZATION" == "AUTHORIZE_ROLLBACK_B_PRESERVE_STATE_7D040592CCF1F149" ]]
              [[ -z "$SURGERY_B_AUTHORIZATION" ]]
              ;;
            *) exit 64 ;;
          esac
          cd bridge-bundle
          sha256sum -c P1_ACTIONS_BUNDLE.sha256
          grep -Fx "EXACT_CANDIDATE_SHA=$EXACT_CANDIDATE_SHA" P1_ACTIONS_BUNDLE.identity
          grep -Fx "EXACT_CANDIDATE_TREE=$EXACT_CANDIDATE_TREE" P1_ACTIONS_BUNDLE.identity
          grep -Fx "EXACT_COMPUTE_RECORD_SHA256=$EXACT_COMPUTE_RECORD_SHA256" P1_ACTIONS_BUNDLE.identity
          grep -Fx "CONTROLLER_SOURCE_IDENTITY=$CONTROLLER_SOURCE_IDENTITY" P1_ACTIONS_BUNDLE.identity
          grep -Fx "CONTROLLER_COMMIT=$CONTROLLER_COMMIT" P1_ACTIONS_BUNDLE.identity
          for archive in p1-surgery-a-releases.tar.gz p1-actions-controller.tar.gz; do
            tar -tzf "$archive" | awk '
              /^\// || /(^|\/)\.\.($|\/)/ { bad=1 }
              END { exit bad ? 1 : 0 }
            '
          done
          tar -xOf p1-surgery-a-releases.tar.gz \
            "$CANDIDATE_ID/P1_SURGERY_A_MANIFEST.json" |
            jq -e --arg sha "$EXACT_CANDIDATE_SHA" --arg tree "$EXACT_CANDIDATE_TREE" \
              '.sourceSha == $sha and .sourceTree == $tree and .releaseRole == "surgery-a-candidate" and .sntssActivated == false and .chronobiologyActivated == false and .newBiologicalAuthority == false' >/dev/null
          tar -xOf p1-surgery-a-releases.tar.gz \
            "$ROLLBACK_ID/P1_SURGERY_A_MANIFEST.json" |
            jq -e --arg sha "$EXACT_CANDIDATE_SHA" --arg tree "$EXACT_CANDIDATE_TREE" \
              '.sourceSha == $sha and .sourceTree == $tree and .releaseRole == "forward-compatible-rollback" and .stateRollbackPolicy == "preserve-forward-state"' >/dev/null
          tar -xOf p1-surgery-a-releases.tar.gz \
            "$A1_ID/P1_SURGERY_A1_MANIFEST.json" |
            jq -e --arg sha "$EXACT_CANDIDATE_SHA" --arg tree "$EXACT_CANDIDATE_TREE" \
              '.baseSourceSha == $sha and .baseSourceTree == $tree and .releaseRole == "resident-control-plane-enablement" and .physiologyActivated == false and .stateStoreSchemaChanged == false and .authorityOwnershipChanged == false and .socketPath == "/run/stay/resident-control.sock"' >/dev/null
          printf 'OPERATION=%s\n' "$REQUESTED_OPERATION" >> "$GITHUB_ENV"

      - name: Prepare deploy key without contacting production
        shell: bash
        env:
          STAY_DEPLOY_KEY: ${{ secrets.STAY_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$STAY_DEPLOY_KEY" > ~/.ssh/stay_deploy
          chmod 0600 ~/.ssh/stay_deploy
          : > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Fail-closed live host identity guard
        id: host_guard
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/stay_deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            staydeploy@35.157.242.167 'bash -s' > "$RUNNER_TEMP/host-guard.raw" 2>&1 <<'REMOTE'
          set -Eeuo pipefail
          EXPECTED_PRIVATE_IPV4="172.26.9.207"
          command -v ip >/dev/null 2>&1 || { echo "HOST_IDENTITY_GUARD=FAIL"; exit 40; }
          OBSERVED_PRIVATE_IPV4="$(ip -o -4 addr show scope global | awk '{a=$4; sub(/\/.*/, "", a); print a}' | sort -u)"
          [[ "$OBSERVED_PRIVATE_IPV4" == "$EXPECTED_PRIVATE_IPV4" ]] || {
            echo "LIVE_HOST_EXPECTED_PRIVATE_IPV4=$EXPECTED_PRIVATE_IPV4"
            echo "OBSERVED_PRIVATE_IPV4=${OBSERVED_PRIVATE_IPV4:-NONE}"
            echo "HOST_IDENTITY_GUARD=FAIL"
            exit 41
          }
          echo "LIVE_HOST_EXPECTED_PRIVATE_IPV4=$EXPECTED_PRIVATE_IPV4"
          echo "OBSERVED_PRIVATE_IPV4=$OBSERVED_PRIVATE_IPV4"
          echo "OBSERVED_HOSTNAME=$(hostname)"
          echo "HOST_IDENTITY_GUARD=PASS"
          echo "HOST_CLASSIFICATION=LIVE_PRODUCTION"
          REMOTE
          grep -Fx 'HOST_IDENTITY_GUARD=PASS' "$RUNNER_TEMP/host-guard.raw"

      - name: Stage sealed artifact only after host guard
        if: inputs.operation != 'configure-b0'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          RUN_ROOT="/opt/stay/incoming/p1-actions-$GITHUB_RUN_ID"
          ssh -i ~/.ssh/stay_deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            staydeploy@35.157.242.167 \
            "set -euo pipefail; [[ '$GITHUB_RUN_ID' =~ ^[0-9]+$ ]]; test ! -e '$RUN_ROOT'; install -d -m 0700 '$RUN_ROOT'"
          scp -i ~/.ssh/stay_deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            bridge-bundle/p1-surgery-a-releases.tar.gz \
            bridge-bundle/p1-actions-controller.tar.gz \
            bridge-bundle/p1-build-result.json \
            bridge-bundle/P1_ACTIONS_BUNDLE.sha256 \
            bridge-bundle/P1_ACTIONS_BUNDLE.identity \
            staydeploy@35.157.242.167:"$RUN_ROOT/"
          ssh -i ~/.ssh/stay_deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            staydeploy@35.157.242.167 \
            "set -euo pipefail; cd '$RUN_ROOT'; sha256sum -c P1_ACTIONS_BUNDLE.sha256; install -d -m 0700 releases; tar -xzf p1-surgery-a-releases.tar.gz -C releases; tar -xzf p1-actions-controller.tar.gz"

      - name: Materialize independently authenticated B.0 completion fingerprint
        if: inputs.operation == 'complete-b0'
        shell: bash
        env:
          INDEPENDENT_FINGERPRINT: ${{ secrets.STAY_B0_RELEASE_AUTHORITY_PUBLIC_KEY_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$INDEPENDENT_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          printf '%s\n' "$INDEPENDENT_FINGERPRINT" > "$RUNNER_TEMP/b0-completion-fingerprint.txt"
          chmod 0400 "$RUNNER_TEMP/b0-completion-fingerprint.txt"

      - name: Stage B.0 completion fingerprint into the validated run root
        if: inputs.operation == 'complete-b0'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          RUN_ROOT="/opt/stay/incoming/p1-actions-$GITHUB_RUN_ID"
          scp -i ~/.ssh/stay_deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$RUNNER_TEMP/b0-completion-fingerprint.txt" \
            staydeploy@35.157.242.167:"$RUN_ROOT/b0-completion-fingerprint.txt"

      - name: Authenticate B.0 trust material with system tools
        if: inputs.operation == 'configure-b0'
        shell: bash
        env:
          PUBLIC_KEY_B64: ${{ secrets.STAY_B0_RELEASE_AUTHORITY_PUBLIC_KEY_B64 }}
          RESIDENT_CERT_B64: ${{ secrets.STAY_B0_RESIDENT_SNTSS_CERTIFICATE_B64 }}
          TRUST_MANIFEST_B64: ${{ secrets.STAY_B0_TRUST_MATERIAL_SHA256_B64 }}
          TRUST_SIGNATURE_B64: ${{ secrets.STAY_B0_TRUST_MATERIAL_SIGNATURE_B64 }}
          INDEPENDENT_FINGERPRINT: ${{ secrets.STAY_B0_RELEASE_AUTHORITY_PUBLIC_KEY_SHA256 }}
        run: |
          set -euo pipefail
          TRUST="$RUNNER_TEMP/b0-trust-material"
          install -d -m 0700 "$TRUST"
          printf '%s' "$PUBLIC_KEY_B64" | base64 -d > "$TRUST/release-authority-public.pem"
          printf '%s' "$RESIDENT_CERT_B64" | base64 -d > "$TRUST/resident-sntss.json"
          printf '%s' "$TRUST_MANIFEST_B64" | base64 -d > "$TRUST/P1_B0_TRUST_MATERIAL.sha256"
          printf '%s' "$TRUST_SIGNATURE_B64" | base64 -d > "$TRUST/P1_B0_TRUST_MATERIAL.sha256.sig"
          [[ "$INDEPENDENT_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(sha256sum "$TRUST/release-authority-public.pem" | awk '{print $1}')" == "$INDEPENDENT_FINGERPRINT" ]]
          [[ "$(awk 'NF==2 {print $2}' "$TRUST/P1_B0_TRUST_MATERIAL.sha256" | LC_ALL=C sort)" == $'release-authority-public.pem\nresident-sntss.json' ]]
          openssl pkeyutl -verify -pubin -rawin \
            -inkey "$TRUST/release-authority-public.pem" \
            -in "$TRUST/P1_B0_TRUST_MATERIAL.sha256" \
            -sigfile "$TRUST/P1_B0_TRUST_MATERIAL.sha256.sig" >/dev/null
          (cd "$TRUST" && sha256sum -c P1_B0_TRUST_MATERIAL.sha256 >/dev/null)
          printf '%s\n' "$INDEPENDENT_FINGERPRINT" > "$TRUST/INDEPENDENT_FINGERPRINT.txt"
          chmod 0400 "$TRUST"/*

      - name: Stage sealed B.0 artifact only after host guard and trust verification
        if: inputs.operation == 'configure-b0'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          RUN_ROOT="/opt/stay/incoming/p1-actions-$GITHUB_RUN_ID"
          ssh -i ~/.ssh/stay_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            staydeploy@35.157.242.167 "set -euo pipefail; test ! -e '$RUN_ROOT'; install -d -m 0700 '$RUN_ROOT'"
          scp -i ~/.ssh/stay_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            bridge-bundle/p1-surgery-a-releases.tar.gz bridge-bundle/p1-actions-controller.tar.gz \
            bridge-bundle/p1-build-result.json bridge-bundle/P1_ACTIONS_BUNDLE.sha256 bridge-bundle/P1_ACTIONS_BUNDLE.identity \
            staydeploy@35.157.242.167:"$RUN_ROOT/"
          scp -r -i ~/.ssh/stay_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$RUNNER_TEMP/b0-trust-material" staydeploy@35.157.242.167:"$RUN_ROOT/"
          ssh -i ~/.ssh/stay_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            staydeploy@35.157.242.167 \
            "set -euo pipefail; cd '$RUN_ROOT'; sha256sum -c P1_ACTIONS_BUNDLE.sha256; install -d -m 0700 releases; tar -xzf p1-surgery-a-releases.tar.gz -C releases; tar -xzf p1-actions-controller.tar.gz"

      - name: Dispatch fixed remote controller operation
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          case "$OPERATION" in preflight|surgery-a|rollback-a|preflight-a1|surgery-a1|rollback-a1|preflight-a1-entrypoint|correct-a1-entrypoint|rollback-a1-entrypoint|preflight-b0|configure-b0|complete-b0|repair-b0-sandbox|complete-b0-sandbox-repair|rollback-b0|preflight-b|surgery-b|rollback-b) ;; *) exit 64 ;; esac
          RUN_ROOT="/opt/stay/incoming/p1-actions-$GITHUB_RUN_ID"
          case "$OPERATION" in
            preflight) AUTHORIZATION_ARGUMENT='NO_AUTHORIZATION' ;;
            surgery-a) AUTHORIZATION_ARGUMENT='AUTHORIZE_SURGERY_A_7D040592CCF1F149' ;;
            rollback-a) AUTHORIZATION_ARGUMENT='AUTHORIZE_ROLLBACK_A_FORWARD_STATE_7D040592CCF1F149' ;;
            preflight-a1) AUTHORIZATION_ARGUMENT='NO_AUTHORIZATION' ;;
            surgery-a1) AUTHORIZATION_ARGUMENT='AUTHORIZE_SURGERY_A1_RESIDENT_CONTROL_7D040592CCF1F149' ;;
            rollback-a1) AUTHORIZATION_ARGUMENT='AUTHORIZE_ROLLBACK_A1_FORWARD_STATE_7D040592CCF1F149' ;;
            preflight-a1-entrypoint) AUTHORIZATION_ARGUMENT='NO_AUTHORIZATION' ;;
            correct-a1-entrypoint) AUTHORIZATION_ARGUMENT='AUTHORIZE_A1_ENTRYPOINT_CORRECTION_7D040592CCF1F149' ;;
            rollback-a1-entrypoint) AUTHORIZATION_ARGUMENT='AUTHORIZE_A1_ENTRYPOINT_ROLLBACK_NO_STATE_7D040592CCF1F149' ;;
            preflight-b0) AUTHORIZATION_ARGUMENT='NO_AUTHORIZATION' ;;
            configure-b0) AUTHORIZATION_ARGUMENT='AUTHORIZE_B0_TRUST_RUNTIME_7D040592CCF1F149' ;;
            complete-b0) AUTHORIZATION_ARGUMENT='AUTHORIZE_B0_COMPLETE_EXISTING_RUNTIME_7D040592CCF1F149' ;;
            repair-b0-sandbox) AUTHORIZATION_ARGUMENT='AUTHORIZE_B0_SANDBOX_REPAIR_7D040592CCF1F149' ;;
            complete-b0-sandbox-repair) AUTHORIZATION_ARGUMENT='AUTHORIZE_B0_SANDBOX_REPAIR_COMPLETION_7D040592CCF1F149' ;;
            rollback-b0) AUTHORIZATION_ARGUMENT='AUTHORIZE_ROLLBACK_B0_FORWARD_STATE_7D040592CCF1F149' ;;
            preflight-b) AUTHORIZATION_ARGUMENT='NO_AUTHORIZATION' ;;
            surgery-b) AUTHORIZATION_ARGUMENT='AUTHORIZE_SURGERY_B_SNTSS_NEUTRAL_7D040592CCF1F149' ;;
            rollback-b) AUTHORIZATION_ARGUMENT='AUTHORIZE_ROLLBACK_B_PRESERVE_STATE_7D040592CCF1F149' ;;
          esac
          set +e
          ssh -i ~/.ssh/stay_deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            staydeploy@35.157.242.167 \
            "sudo -n /usr/local/sbin/stay-p1-production-controller '$OPERATION' '$RUN_ROOT' '$AUTHORIZATION_ARGUMENT'" \
            > "$RUNNER_TEMP/controller.raw" 2>&1
          CONTROLLER_STATUS=$?
          set -e
          CONTROLLER_FAILURE_CLASS='NONE'
          if [[ "$CONTROLLER_STATUS" -ne 0 ]]; then
            CONTROLLER_FAILURE_CLASS='PRIVILEGED_DISPATCH_FAILED'
            WRAPPER_CLASS="$(grep -E '^CONTROLLER_FAILURE_CLASS=(PRIVILEGE_DENIED|HOST_IDENTITY_FAILED|AUTHORIZATION_FAILED|OPERATION_REJECTED|PATH_VALIDATION_FAILED|TRUSTED_RUNTIME_FAILED|STAGED_IDENTITY_FAILED|REMOTE_CONTROLLER_FAILED|RESULT_MARKER_MISSING|PREFLIGHT_MUTATION_DETECTED|CLEANUP_FAILED|PRIVILEGED_CONTROLLER_FAILED|RELEASE_INSTALL_DESTINATION_PRECHECK_FAILED|RELEASE_INSTALL_COPY_FAILED|RELEASE_INSTALL_CHOWN_FAILED|RELEASE_INSTALL_CHMOD_DIRS_FAILED|RELEASE_INSTALL_CHMOD_FILES_FAILED|RELEASE_INSTALL_ATOMIC_PUBLISH_FAILED|RELEASE_INSTALL_EXISTING_RELEASE_VERIFY_FAILED)$' "$RUNNER_TEMP/controller.raw" | tail -n 1 | cut -d= -f2 || true)"
            if [[ -n "$WRAPPER_CLASS" ]]; then
              CONTROLLER_FAILURE_CLASS="$WRAPPER_CLASS"
            elif grep -Eqi '(not allowed to execute|a password is required|no tty present|sudoers)' "$RUNNER_TEMP/controller.raw"; then
              CONTROLLER_FAILURE_CLASS='PRIVILEGE_DENIED'
            elif grep -Eqi '(command not found|No such file or directory).*stay-p1-production-controller|stay-p1-production-controller.*(command not found|No such file or directory)' "$RUNNER_TEMP/controller.raw"; then
              CONTROLLER_FAILURE_CLASS='PRIVILEGED_WRAPPER_UNAVAILABLE'
            elif [[ "$CONTROLLER_STATUS" -eq 255 ]]; then
              CONTROLLER_FAILURE_CLASS='SSH_TRANSPORT_FAILED'
            fi
          fi
          printf 'CONTROLLER_DISPATCH_STATUS=%s\nCONTROLLER_FAILURE_CLASS=%s\n' \
            "$CONTROLLER_STATUS" "$CONTROLLER_FAILURE_CLASS" > "$RUNNER_TEMP/controller-classification.env"
          case "$OPERATION" in
            preflight) EXPECTED_RESULT='PREFLIGHT_RESULT=PASS' ;;
            surgery-a) EXPECTED_RESULT='SURGERY_A_RESULT=PASS' ;;
            rollback-a) EXPECTED_RESULT='ROLLBACK_A_RESULT=PASS' ;;
            preflight-a1) EXPECTED_RESULT='PREFLIGHT_A1_RESULT=PASS' ;;
            surgery-a1) EXPECTED_RESULT='A1_RESULT=PASS' ;;
            rollback-a1) EXPECTED_RESULT='ROLLBACK_A1_RESULT=PASS' ;;
            preflight-a1-entrypoint) EXPECTED_RESULT='PREFLIGHT_A1_ENTRYPOINT_RESULT=PASS' ;;
            correct-a1-entrypoint) EXPECTED_RESULT='A1_ENTRYPOINT_RESULT=PASS' ;;
            rollback-a1-entrypoint) EXPECTED_RESULT='ROLLBACK_A1_ENTRYPOINT_RESULT=PASS' ;;
            preflight-b0) EXPECTED_RESULT='PREFLIGHT_B0_RESULT=PASS' ;;
            configure-b0) EXPECTED_RESULT='B0_RESULT=PASS' ;;
            complete-b0) EXPECTED_RESULT='B0_COMPLETION_RESULT=PASS' ;;
            repair-b0-sandbox) EXPECTED_RESULT='B0_SANDBOX_REPAIR_RESULT=PASS' ;;
            complete-b0-sandbox-repair) EXPECTED_RESULT='B0_SANDBOX_REPAIR_COMPLETION_RESULT=PASS' ;;
            rollback-b0) EXPECTED_RESULT='ROLLBACK_B0_RESULT=PASS' ;;
            preflight-b) EXPECTED_RESULT='PREFLIGHT_B_RESULT=PASS' ;;
            surgery-b) EXPECTED_RESULT='SURGERY_B_RESULT=PASS' ;;
            rollback-b) EXPECTED_RESULT='ROLLBACK_B_RESULT=PASS' ;;
          esac
          [[ "$CONTROLLER_STATUS" -eq 0 ]]
          grep -Fx "$EXPECTED_RESULT" "$RUNNER_TEMP/controller.raw"

      - name: Build sanitized Actions evidence
        if: always()
        shell: bash
        env:
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          install -d -m 0700 actions-evidence
          {
            echo "ACTIONS_EVIDENCE_FORMAT=stay-p1-surgery-a-sanitized-v1"
            echo "ACTIONS_RUN_ID=$GITHUB_RUN_ID"
            echo "WORKFLOW_COMMIT=$GITHUB_SHA"
            echo "BRANCH=$GITHUB_REF_NAME"
            echo "OPERATION=$REQUESTED_OPERATION"
            echo "EXACT_CANDIDATE_SHA=$EXACT_CANDIDATE_SHA"
            echo "EXACT_CANDIDATE_TREE=$EXACT_CANDIDATE_TREE"
            echo "PRODUCTION_PUBLIC_IPV4=$PRODUCTION_PUBLIC_IPV4"
            echo "CAPTURED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for source in "$RUNNER_TEMP/host-guard.raw" "$RUNNER_TEMP/controller-classification.env" "$RUNNER_TEMP/controller.raw"; do
              [[ -f "$source" ]] || continue
              grep -E '^(LIVE_HOST_EXPECTED_PRIVATE_IPV4|OBSERVED_PRIVATE_IPV4|OBSERVED_HOSTNAME|HOST_IDENTITY_GUARD|HOST_CLASSIFICATION|PREFLIGHT_RESULT|PREFLIGHT_A1_RESULT|PREFLIGHT_A1_ENTRYPOINT_RESULT|PREFLIGHT_B0_RESULT|PREFLIGHT_B_RESULT|B0_RESULT|B0_COMPLETION_RESULT|B0_PROVISIONING_ALREADY_LIVE|B0_SANDBOX_REPAIR_RESULT|B0_SANDBOX_REPAIR_COMPLETION_RESULT|ROOT_CAUSE|B0_SANDBOX_REPAIR_SEAL|B0_SANDBOX_REPAIR_EVIDENCE_DIGEST|LIVE_USER_CORE_INSPECT|LIVE_USER_PROMOTION|LABORATORY_BYPASS|SERVICE_INHERITABLE_CAPABILITIES_HEX|SERVICE_PERMITTED_CAPABILITIES|SERVICE_EFFECTIVE_CAPABILITIES|SERVICE_AMBIENT_CAPABILITIES|NO_NEW_PRIVILEGES|CAPABILITY_BOUNDING_SET|TRUST_MATERIAL_CHANGE|ROLLBACK_B0_RESULT|A1_RESULT|A1_ENTRYPOINT_RESULT|ROLLBACK_A1_RESULT|ROLLBACK_A1_ENTRYPOINT_RESULT|SURGERY_B_RESULT|ROLLBACK_B_RESULT|CURRENT_POINTER|CURRENT_RELEASE|STATESTORE_SCHEMA|SERVICE_ACTIVE|HEALTH|ENTRYPOINT|RUNTIME_REVISION|RUNTIME_REVISION_BEFORE|RUNTIME_REVISION_AFTER|SIGNED_PROMOTION_ENFORCED|PACKAGE_POLICY_ENFORCED|OS_SANDBOX_ENFORCED|TRUSTED_TIME_PULSE_INTERVAL_MS|RESIDENT_CERTIFICATE|PRIVATE_KEY_ON_PRODUCTION|RESIDENT_CERTIFICATE_REQUEST|SNTSS_ATTACHED|CHRONOBIOLOGY_ATTACHED|SNTSS_RESIDENT_PRESENT|CHRONOBIOLOGY_RESIDENT_PRESENT|SNTSS_AUTHORITY|CHRONOBIOLOGY_AUTHORITY|FORWARD_RESTART_CONTINUITY|B0_BASELINE_SEAL|READY_FOR_SURGERY_B_PREFLIGHT|B0_EVIDENCE_DIGEST|CANONICAL_FORWARD_STATE_PRESERVED|BIOLOGICAL_STATE_RESTORED|PREFLIGHT_B0_ABORT|B0_ABORT|B0_COMPLETION_ABORT|B0_SANDBOX_REPAIR_ABORT|B0_SANDBOX_REPAIR_COMPLETION_ABORT|ROLLBACK_B0_ABORT|PREFLIGHT_B_ABORT|SURGERY_B_ABORT|ROLLBACK_B_ABORT|P1_CONTROLLER_ABORT|CONTROLLER_DISPATCH_STATUS|CONTROLLER_FAILURE_CLASS|CONTROLLER_CLEANUP_STATUS|SERVICE_RESTARTED|DAEMON_RELOAD|SERVICE_OPERATION|CURRENT_POINTER_CHANGE|STATESTORE_WRITE|STATESTORE_FORWARD_RESTART_WRITE|RESIDENT_OPERATION|AUTHORITY_CHANGE)=' "$source" || true
              grep -E '^(PRE_WRITE_LIVE_SENTINEL|POST_A1_RELEASE|STATESTORE_PRE_SCHEMA|STATESTORE_POST_SCHEMA|STATESTORE_CONTINUITY|SURGERY_A_RESULT|ROLLBACK_A_RESULT|PRE_SURGERY_RELEASE|POST_SURGERY_RELEASE|ENTRYPOINT_BEFORE|ENTRYPOINT_AFTER|RESIDENT_CONTROL_SOCKET|DROPIN_REMOVED|DAEMON_RELOAD|SERVICE_RESTARTED|BSF_STATUS|RESIDENT_MANAGER_STATUS|RESIDENT_CONTROL|EXISTING_FETUS_CONTINUITY|EXISTING_FETUS_IDENTITY_CONTINUITY|ORGANISM_IDENTITY_CONTINUITY|CHECKPOINT_FORWARD_ONLY|FETUS_INSTANCE_ID|FETUS_VERSION|FETUS_AUTHORITY_EPOCH|FETUS_BARRIER_SEQUENCE|FETUS_CHECKPOINT_GENERATION|FETUS_CHECKPOINT_HASH|FETUS_CHECKPOINT_HASH_CHANGED|ORGANISM_IDENTITY_HASH|RESIDENT_SNTSS_PRESENT|SNTSS_STATUS|SNTSS_RESIDENCY_ID|SNTSS_VERSION|SNTSS_STATE_SCHEMA|SNTSS_PACKAGE_POLICY_HASH|SNTSS_OUTPUT_COUNT|SNTSS_SIGNALLING|SNTSS_PRODUCTION_ELIGIBLE|INITIAL_CHECKPOINT_HASH|FINAL_SMOKE_CHECKPOINT_HASH|CHECKPOINT_GENERATION|RESIDENT_TRANSITION_SEQUENCE|PULSE_ACK_COUNT|AUTHORITY_BEFORE_HASH|AUTHORITY_AFTER_HASH|SIGNED_PROMOTION|SNTSS_NEW_ACTIVATION|CHRONOBIOLOGY_ACTIVATED|BIOLOGICAL_AUTHORITY_CHANGED|BIOLOGICAL_AUTHORITY_OWNERSHIP_CHANGED|ROLLBACK_READY|FORWARD_COMPATIBLE_ROLLBACK|SURGERY_A_EVIDENCE_DIGEST|ROLLBACK_A_EVIDENCE_DIGEST|A1_EVIDENCE_DIGEST|A1_ENTRYPOINT_EVIDENCE_DIGEST|READY_FOR_SURGERY_B|EVIDENCE_DIR|PREFLIGHT_ABORT|PREFLIGHT_A1_ABORT|PREFLIGHT_A1_ENTRYPOINT_ABORT|SURGERY_A_ABORT|SURGERY_A1_ABORT|A1_ENTRYPOINT_ABORT|ROLLBACK_A_ABORT|ROLLBACK_A1_ABORT|ROLLBACK_A1_ENTRYPOINT_ABORT|RELEASE_INSTALL_STAGE)=' "$source" || true
            done
          } > actions-evidence/sanitized-summary.txt
          sha256sum actions-evidence/sanitized-summary.txt > actions-evidence/sanitized-summary.txt.sha256
          cat actions-evidence/sanitized-summary.txt

      - name: Upload sanitized execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p1-surgery-a-evidence-${{ github.run_id }}-${{ inputs.operation }}
          path: actions-evidence/
          if-no-files-found: error
          retention-days: 30
