name: Capture final transplant live state

on:
  push:
    branches: [main]
    paths: [.github/p1-final-live-state.launch]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare deploy key
        shell: bash
        env:
          STAY_DEPLOY_KEY: ${{ secrets.STAY_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          grep -Fx 'P1_FINAL_LIVE_STATE=AUTHORIZED' .github/p1-final-live-state.launch
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$STAY_DEPLOY_KEY" > ~/.ssh/stay_deploy
          chmod 0600 ~/.ssh/stay_deploy
          : > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Capture read-only production state
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/stay_deploy -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            staydeploy@35.157.242.167 'bash -s' \
            > "$RUNNER_TEMP/state.env" <<'REMOTE'
          set -Eeuo pipefail
          observed_ip="$(ip -o -4 addr show scope global | awk '{a=$4; sub(/\/.*/, "", a); print a}' | sort -u)"
          [[ "$observed_ip" == 172.26.9.207 ]]
          echo 'P1_FINAL_LIVE_STATE_FORMAT=stay-p1-final-live-state-v1'
          echo "OBSERVED_PRIVATE_IPV4=$observed_ip"
          echo "CURRENT_POINTER=$(readlink -f /opt/stay/current)"
          curl -fsS --max-time 5 http://127.0.0.1:8787/healthz | node -e 'let b="";process.stdin.on("data",c=>b+=c).on("end",()=>{const v=JSON.parse(b);console.log(`HEALTH_OK=${v.ok}\nKERNEL_VERSION=${v.version}\nRUNTIME_REVISION=${v.revision}`)})'
          pid="$(systemctl show stay.service -p MainPID --value)"
          echo "SERVICE_MAIN_PID=$pid"
          systemctl show stay.service -p ActiveState -p SubState -p NRestarts -p NoNewPrivileges --no-pager | sed 's/^/SERVICE_/'
          for key in CapPrm CapEff CapBnd CapAmb NoNewPrivs; do
            awk -v key="$key" '$1 == key ":" { print "PROCESS_" key "=" $2 }' "/proc/$pid/status"
          done
          if [[ -e /usr/local/libexec/stay-bwrap-sandbox ]]; then
            echo 'BWRAP_HELPER_PRESENT=YES'
            stat -Lc 'BWRAP_HELPER_STAT=%U:%G:%a:%h' /usr/local/libexec/stay-bwrap-sandbox
            sha256sum /usr/local/libexec/stay-bwrap-sandbox | awk '{print "BWRAP_HELPER_SHA256=sha256:" $1}'
          else
            echo 'BWRAP_HELPER_PRESENT=NO'
          fi
          [[ -e /etc/stay/p1-b0-sandbox-final.env ]] && echo 'FINAL_SANDBOX_SEAL_PRESENT=YES' || echo 'FINAL_SANDBOX_SEAL_PRESENT=NO'
          stage='/opt/stay/incoming/p1-final-transplant-32661174982'
          if [[ -d "$stage" && ! -L "$stage" ]]; then
            echo 'STAGED_ROOT_PRESENT=YES'
            stat -Lc 'STAGED_ROOT_STAT=%U:%G:%a:%h' "$stage"
            if [[ -f "$stage/p1-finish-transplant-root.sh" && ! -L "$stage/p1-finish-transplant-root.sh" ]]; then
              stat -Lc 'STAGED_SCRIPT_STAT=%U:%G:%a:%h' "$stage/p1-finish-transplant-root.sh"
              sha256sum "$stage/p1-finish-transplant-root.sh" | awk '{print "STAGED_SCRIPT_SHA256=" $1}'
            else
              echo 'STAGED_SCRIPT_PRESENT=NO'
            fi
          else
            echo 'STAGED_ROOT_PRESENT=NO'
          fi
          bwrap_source="$(readlink -f /usr/bin/bwrap)"
          echo "BWRAP_SOURCE=$bwrap_source"
          stat -Lc 'BWRAP_SOURCE_STAT=%U:%G:%a:%h' "$bwrap_source"
          sha256sum "$bwrap_source" | awk '{print "BWRAP_SOURCE_SHA256=sha256:" $1}'
          [[ -S /run/stay/resident-control.sock ]] && echo 'RESIDENT_CONTROL_SOCKET=PASS' || echo 'RESIDENT_CONTROL_SOCKET=FAIL'
          cgroup_relative="$(awk -F: '$1 == "0" { print $3 }' "/proc/$pid/cgroup")"
          cgroup_kernel="/sys/fs/cgroup${cgroup_relative}"
          cgroup_unit="$(dirname "$cgroup_kernel")"
          cgroup_cores="$cgroup_unit/stay-cores"
          echo "CGROUP_KERNEL=$cgroup_kernel"
          for pair in "UNIT:$cgroup_unit" "CORES:$cgroup_cores" "KERNEL:$cgroup_kernel"; do
            name="${pair%%:*}"; directory="${pair#*:}"
            if [[ -r "$directory/memory.events" ]]; then
              while read -r key value; do echo "CGROUP_${name}_MEMORY_${key^^}=$value"; done < "$directory/memory.events"
            fi
          done
          node <<'NODE'
          'use strict';
          const net = require('node:net');
          const { DatabaseSync } = require('node:sqlite');
          const status = residencyId => new Promise((resolve, reject) => {
            const socket = net.createConnection('/run/stay/resident-control.sock');
            socket.setEncoding('utf8');
            let body = '';
            const timer = setTimeout(() => socket.destroy(new Error('timeout')), 10000);
            socket.once('connect', () => socket.write(JSON.stringify({format:'stay-resident-control-v1',operation:'status',residencyId}) + '\n'));
            socket.on('data', chunk => body += chunk);
            socket.once('end', () => { clearTimeout(timer); try { resolve(JSON.parse(body)); } catch (e) { reject(e); } });
            socket.once('error', reject);
          });
          (async () => {
            for (const [name, id] of [['SNTSS','resident:sntss'],['CHRONOBIOLOGY','resident:chronobiology']]) {
              const r = await status(id); const v = r.resident || {};
              console.log(`${name}_PRESENT=${v.present}`);
              console.log(`${name}_STATUS=${v.status}`);
              console.log(`${name}_RUNNING=${v.running}`);
              console.log(`${name}_VERSION=${v.version}`);
              console.log(`${name}_CHECKPOINT_GENERATION=${v.checkpointGeneration}`);
              console.log(`${name}_HANDLED_EVENTS=${v.handledEvents}`);
              console.log(`${name}_AUTHORITY_OWNED=${v.authorityOwned}`);
              console.log(`${name}_OBSERVED_OUTPUTS=${v.observedOutputs}`);
            }
            const db = new DatabaseSync('/var/lib/stay/data/continuity.sqlite3', {readOnly:true});
            db.exec('PRAGMA query_only=ON');
            console.log('DB_RESIDENT_COUNT=' + Number(db.prepare('SELECT COUNT(*) AS n FROM resident_instances').get().n));
            console.log('DB_SNTSS_COUNT=' + Number(db.prepare("SELECT COUNT(*) AS n FROM resident_instances WHERE residency_id='resident:sntss'").get().n));
            console.log('DB_PHYSIOLOGY_AUTHORITY_COUNT=' + Number(db.prepare("SELECT COUNT(*) AS n FROM authority WHERE core_id IN ('sntss','chronobiology')").get().n));
            db.close();
          })().catch(e => { console.log('STATE_PROBE_ERROR=' + String(e.code || e.message || e).replace(/\s+/g,' ').slice(0,512)); process.exitCode=1; });
          NODE
          REMOTE
          cat "$RUNNER_TEMP/state.env"
      - name: Publish live state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          content="$(base64 -w0 "$RUNNER_TEMP/state.env")"
          path_name='ops/p1-final-live-state.env'
          old="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path_name?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path_name" -f message='Record final transplant live state' -f content="$content" -f branch=main)
          [[ -z "$old" ]] || args+=(-f sha="$old")
          gh api "${args[@]}" >/dev/null
