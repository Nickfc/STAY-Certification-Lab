name: Manually stage STAY pre-certification on Lightsail

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Verify runtime
        run: npm test

      - name: Build immutable staging archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').stayVersion || require('./package.json').version")"
          ARCHIVE="stay-${VERSION}-${GITHUB_SHA}.tar.gz"
          node -e "require('fs').writeFileSync('RELEASE_PROVENANCE.json', JSON.stringify({format:'stay-release-provenance-v1',version:process.argv[1],commit:process.env.GITHUB_SHA,builder:'github-actions',workflow:process.env.GITHUB_WORKFLOW,runId:process.env.GITHUB_RUN_ID}, null, 2) + '\n')" "$VERSION"
          tar \
            --exclude='.git' \
            --exclude='data' \
            --exclude='.stay-data' \
            -czf "$ARCHIVE" \
            README.md README_DEPLOYMENT.md RELEASE_PROVENANCE.json package.json server.js .github runtime cores deploy docs scripts legacy test
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          printf 'ARCHIVE=%s\n' "$ARCHIVE" >> "$GITHUB_ENV"

      - name: Prepare SSH
        shell: bash
        env:
          STAY_DEPLOY_KEY: ${{ secrets.STAY_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAY_DEPLOY_KEY" > ~/.ssh/stay_deploy
          chmod 600 ~/.ssh/stay_deploy
          ssh-keyscan -H 35.157.242.167 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload to incoming only
        shell: bash
        run: |
          set -euo pipefail
          scp -i ~/.ssh/stay_deploy -o IdentitiesOnly=yes "$ARCHIVE" "$ARCHIVE.sha256" staydeploy@35.157.242.167:/opt/stay/incoming/

      - name: Verify staged archive on Lightsail
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/stay_deploy -o IdentitiesOnly=yes staydeploy@35.157.242.167 "cd /opt/stay/incoming && sha256sum -c '$ARCHIVE.sha256'"
