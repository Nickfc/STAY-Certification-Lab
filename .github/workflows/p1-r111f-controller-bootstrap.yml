name: R116F V15 privileged controller bootstrap
run-name: R116F V15 privileged controller bootstrap · ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Exact one-shot controller bootstrap authorization
        required: true
        type: choice
        default: NO
        options:
          - NO
          - AUTHORIZE_R116F_V15_PINNED_CONTROLLER_BOOTSTRAP

permissions:
  contents: read

concurrency:
  group: stay-r116f-v15-controller-bootstrap
  cancel-in-progress: false

env:
  WRAPPER_SHA256: d08e141be91e37b2fc126fadc33f207a475b427e2f5bfc60cc139811cd71cb5a
  INSTALLER_SHA256: 4800f1898b24648f2749bb925bcf45dae5989a6992dd4885d66ebb81409ac8da
  PRODUCTION_PUBLIC_IPV4: 35.157.242.167
  PRODUCTION_PRIVATE_IPV4: 172.26.9.207
  PRODUCTION_SSH_ED25519_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBvxednOQ0VcQL1KR0MewyXFCqufbwWsg0Lkgg/MwMUS
  PRODUCTION_SSH_ED25519_FINGERPRINT: SHA256:z0aBq4eHfQpARjsa7pfpL2spIVi62lqwx54mlm9XU8Q

jobs:
  validate-and-seal:
    name: Validate and seal controller without production credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact dispatch revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate exact source and controller contract
        shell: bash
        env:
          REQUESTED_AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$REQUESTED_AUTHORIZATION" == AUTHORIZE_R116F_V15_PINNED_CONTROLLER_BOOTSTRAP ]]
          wrapper='deploy/live-physiology-transplant/stay-p1-production-controller'
          installer='deploy/live-physiology-transplant/install-p1-production-controller.sh'
          [[ "$(sha256sum "$wrapper" | awk '{print $1}')" == "$WRAPPER_SHA256" ]]
          [[ "$(sha256sum "$installer" | awk '{print $1}')" == "$INSTALLER_SHA256" ]]
          bash -n "$wrapper"
          bash -n "$installer"
          grep -Fq 'EXPECTED_R116F_ARCHIVE_SHA256="8836a624c7fa65a9c82f2de163679b0eaa12b5bf864a72ca16326dda54247b0a"' "$wrapper"
          grep -Fq 'EXPECTED_R116F_RELEASE_COMMIT="cbf047e3fb42acdb504119c8be6a102fa32c3860"' "$wrapper"
          grep -Fq 'EXPECTED_R116F_RELEASE_TREE="54ed5645470b9aff7c44187247c79c555737bcd7"' "$wrapper"
          grep -Fq 'EXPECTED_R116F_MANIFEST_SHA256="647ffe294b9a462ef4a3ff44e8303adf6e069fc122e4df7e0eed3976b4c5ee94"' "$wrapper"
          grep -Fq 'EXPECTED_R116F_FORWARD_SHA256="49ef71c9c4eac735e42a53d628fd2030197e23309e8fc27b105987e549c49751"' "$wrapper"
          grep -Fq 'EXPECTED_R116F_RECOVERY_SHA256="4347510b5eb52f99707ae57c6904e2631838dfa6efe418ca4f4afdfa686c5dec"' "$wrapper"
          grep -Fq 'R116F_FORWARD_RUNTIME_SECONDS=1500' "$wrapper"
          grep -Fq 'R116F_RECOVERY_RUNTIME_SECONDS=900' "$wrapper"
          grep -Fq 'prepare_r116f_private_release' "$wrapper"
          operations="$(sed -n '/^  case "$operation" in$/,/^  esac$/p' "$wrapper" |
            sed -n 's/^    \([^*][^)]*\))$/\1/p')"
          [[ "$operations" == $'harden-r116f\nrecover-r116f' ]]
          grep -Fx 'staydeploy ALL=(root) NOPASSWD: /usr/local/sbin/stay-p1-production-controller' <(
            sed -n "/<<'SUDOERS'/,/^SUDOERS$/p" "$installer" | sed '1d;$d'
          )
          if sed -n "/<<'SUDOERS'/,/^SUDOERS$/p" "$installer" |
             grep -Eq 'systemd-run|/bin/(ba)?sh|\bnode\b|\brm\b|\bcp\b|\bmv\b|systemctl'; then
            exit 1
          fi
          node --test --test-concurrency=1 \
            test/production-hardening-deployment-workflow.test.js
      - name: Seal exact bootstrap artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/r116f-v15-controller-bootstrap"
          install -d -m 0700 "$artifact"
          install -m 0555 deploy/live-physiology-transplant/stay-p1-production-controller \
            "$artifact/stay-p1-production-controller"
          install -m 0555 deploy/live-physiology-transplant/install-p1-production-controller.sh \
            "$artifact/install-p1-production-controller.sh"
          (
            cd "$artifact"
            sha256sum stay-p1-production-controller install-p1-production-controller.sh > \
              P1_R116F_V15_CONTROLLER_BOOTSTRAP.sha256
          )
          [[ "$(sha256sum "$artifact/stay-p1-production-controller" | awk '{print $1}')" == "$WRAPPER_SHA256" ]]
          [[ "$(sha256sum "$artifact/install-p1-production-controller.sh" | awk '{print $1}')" == "$INSTALLER_SHA256" ]]
      - name: Upload sealed bootstrap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r116f-v15-controller-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/r116f-v15-controller-bootstrap/
          if-no-files-found: error
          retention-days: 7

  stage-and-await-root-bridge:
    name: Stage controller and await out-of-band root bridge
    needs: validate-and-seal
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    steps:
      - name: Download isolated sealed bootstrap artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: r116f-v15-controller-bootstrap-${{ github.run_id }}
          path: bootstrap-artifact
      - name: Validate sealed artifact before credentials
        shell: bash
        run: |
          set -euo pipefail
          expected=$'P1_R116F_V15_CONTROLLER_BOOTSTRAP.sha256\ninstall-p1-production-controller.sh\nstay-p1-production-controller'
          [[ "$(find bootstrap-artifact -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)" == "$expected" ]]
          (cd bootstrap-artifact && sha256sum -c P1_R116F_V15_CONTROLLER_BOOTSTRAP.sha256)
          [[ "$(sha256sum bootstrap-artifact/stay-p1-production-controller | awk '{print $1}')" == "$WRAPPER_SHA256" ]]
          [[ "$(sha256sum bootstrap-artifact/install-p1-production-controller.sh | awk '{print $1}')" == "$INSTALLER_SHA256" ]]
      - name: Prepare deployment key
        shell: bash
        env:
          STAY_DEPLOY_KEY: ${{ secrets.STAY_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$STAY_DEPLOY_KEY" > ~/.ssh/stay_deploy
          chmod 0600 ~/.ssh/stay_deploy
          printf '%s %s\n' "$PRODUCTION_PUBLIC_IPV4" "$PRODUCTION_SSH_ED25519_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          [[ "$(wc -l < ~/.ssh/known_hosts)" == 1 ]]
          [[ "$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')" == "$PRODUCTION_SSH_ED25519_FINGERPRINT" ]]
      - name: Guard host, stage exact controller, and emit root bridge contract
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          run_root="/opt/stay/incoming/r116f-controller-v15-${GITHUB_RUN_ID}"
          printf 'RUN_ROOT=%s\n' "$run_root" >> "$GITHUB_ENV"
          ssh_options=(-i ~/.ssh/stay_deploy -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          # Fixed local identities are intentionally expanded into the remote guard.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" staydeploy@"$PRODUCTION_PUBLIC_IPV4" \
            "set -euo pipefail; observed=\$(ip -o -4 addr show scope global | awk '{a=\$4;sub(/\\/.*/,\"\",a);print a}' | sort -u); [[ \"\$observed\" == '$PRODUCTION_PRIVATE_IPV4' ]]; test ! -e '$run_root'; install -d -m 0700 '$run_root'"
          scp "${ssh_options[@]}" \
            bootstrap-artifact/stay-p1-production-controller \
            bootstrap-artifact/install-p1-production-controller.sh \
            bootstrap-artifact/P1_R116F_V15_CONTROLLER_BOOTSTRAP.sha256 \
            staydeploy@"$PRODUCTION_PUBLIC_IPV4":"$run_root/"
          ssh "${ssh_options[@]}" staydeploy@"$PRODUCTION_PUBLIC_IPV4" 'bash -s' -- \
            "$run_root" "$WRAPPER_SHA256" "$INSTALLER_SHA256" <<'REMOTE'
          set -Eeuo pipefail
          root="$1"; wrapper_sha="$2"; installer_sha="$3"
          [[ "$root" =~ ^/opt/stay/incoming/r116f-controller-v15-[0-9]+$ && -d "$root" && ! -L "$root" ]]
          root_identity="$(stat -Lc '%U:%G' "$root")"
          root_mode="$(stat -Lc '%a' "$root")"
          echo "R116F_V15_CONTROLLER_STAGE_IDENTITY=$root_identity"
          echo "R116F_V15_CONTROLLER_STAGE_MODE=$root_mode"
          [[ "$root_identity" == staydeploy:staydeploy ]]
          [[ "$root_mode" == 700 || "$root_mode" == 2700 ]]
          [[ -z "$(find -P "$root" -xdev ! -user staydeploy -print -quit)" ]]
          [[ -z "$(find -P "$root" -xdev \( -type l -o -type f -links +1 -o ! -type d ! -type f \) -print -quit)" ]]
          (cd "$root" && sha256sum -c P1_R116F_V15_CONTROLLER_BOOTSTRAP.sha256)
          [[ "$(sha256sum "$root/stay-p1-production-controller" | awk '{print $1}')" == "$wrapper_sha" ]]
          [[ "$(sha256sum "$root/install-p1-production-controller.sh" | awk '{print $1}')" == "$installer_sha" ]]
          find -P "$root" -xdev -type f -exec chmod 0400 {} +
          echo 'R116F_V15_CONTROLLER_STAGE=PASS'
          REMOTE
          bridge="sudo /bin/bash -c 'set -Eeuo pipefail; root=\"\$1\"; wrapper_sha=\"\$2\"; installer_sha=\"\$3\"; [[ \"\$root\" =~ ^/opt/stay/incoming/r116f-controller-v15-[0-9]+\$ && -d \"\$root\" && ! -L \"\$root\" ]]; [[ \"\$(sha256sum \"\$root/stay-p1-production-controller\" | awk '\"'\"'{print \$1}'\"'\"')\" == \"\$wrapper_sha\" ]]; [[ \"\$(sha256sum \"\$root/install-p1-production-controller.sh\" | awk '\"'\"'{print \$1}'\"'\"')\" == \"\$installer_sha\" ]]; private=\$(mktemp -d /run/stay-r116f-v15-bootstrap.XXXXXX); trap '\"'\"'rm -rf -- \"\$private\"'\"'\"' EXIT; install -o root -g root -m 0555 \"\$root/stay-p1-production-controller\" \"\$private/stay-p1-production-controller\"; install -o root -g root -m 0555 \"\$root/install-p1-production-controller.sh\" \"\$private/install-p1-production-controller.sh\"; [[ \"\$(sha256sum \"\$private/stay-p1-production-controller\" | awk '\"'\"'{print \$1}'\"'\"')\" == \"\$wrapper_sha\" ]]; [[ \"\$(sha256sum \"\$private/install-p1-production-controller.sh\" | awk '\"'\"'{print \$1}'\"'\"')\" == \"\$installer_sha\" ]]; /bin/bash \"\$private/install-p1-production-controller.sh\"' _ '$run_root' '$WRAPPER_SHA256' '$INSTALLER_SHA256'"
          echo "MANUAL_ROOT_BRIDGE_RUN_ROOT=$run_root"
          echo "MANUAL_ROOT_BRIDGE_COMMAND=$bridge"
          {
            echo '### R116F V15 root bridge required'
            echo
            echo 'Run this exact command in the production host console. It copies the staged files into a private root-owned directory, re-verifies both SHA-256 values, and runs the source-controlled installer:'
            echo
            echo '```bash'
            echo "$bridge"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Await exact installed controller and clean sealed stage
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-i ~/.ssh/stay_deploy -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          installed=0
          for _ in $(seq 1 540); do
            # The sealed wrapper hash is intentionally expanded into the remote probe.
            # shellcheck disable=SC2029
            if ssh "${ssh_options[@]}" staydeploy@"$PRODUCTION_PUBLIC_IPV4" \
              "test -f /usr/local/sbin/stay-p1-production-controller && test ! -L /usr/local/sbin/stay-p1-production-controller && test \"\$(stat -Lc '%U:%G:%a:%h' /usr/local/sbin/stay-p1-production-controller)\" = root:root:555:1 && test \"\$(sha256sum /usr/local/sbin/stay-p1-production-controller | awk '{print \$1}')\" = '$WRAPPER_SHA256'"; then
              installed=1
              break
            fi
            sleep 5
          done
          [[ "$installed" -eq 1 ]]
          ssh "${ssh_options[@]}" staydeploy@"$PRODUCTION_PUBLIC_IPV4" 'bash -s' -- \
            "$RUN_ROOT" "$WRAPPER_SHA256" "$INSTALLER_SHA256" <<'REMOTE'
          set -Eeuo pipefail
          root="$1"; wrapper_sha="$2"; installer_sha="$3"
          [[ "$root" =~ ^/opt/stay/incoming/r116f-controller-v15-[0-9]+$ && -d "$root" && ! -L "$root" ]]
          [[ "$(sha256sum "$root/stay-p1-production-controller" | awk '{print $1}')" == "$wrapper_sha" ]]
          [[ "$(sha256sum "$root/install-p1-production-controller.sh" | awk '{print $1}')" == "$installer_sha" ]]
          [[ -z "$(find -P "$root" -xdev \( -type l -o -type f -links +1 -o ! -type d ! -type f \) -print -quit)" ]]
          find -P "$root" -xdev -type d -exec chmod u+rwx {} +
          find -P "$root" -xdev -type f -exec chmod u+rw {} +
          rm -rf --one-file-system -- "$root"
          [[ ! -e "$root" && ! -L "$root" ]]
          echo 'R116F_V15_CONTROLLER_BOOTSTRAP=PASS'
          echo "R116F_V15_CONTROLLER_SHA256=sha256:$wrapper_sha"
          echo 'SUDOERS_SCOPE=STAYDEPLOY_TO_PINNED_P1_CONTROLLER_ONLY'
          REMOTE
