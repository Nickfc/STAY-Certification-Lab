name: R150 R148 HOMEOS init forward recovery
run-name: R150 R148 HOMEOS recovery · ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed revision-fenced operation
        required: true
        type: choice
        default: recover-r148-homeos-init
        options:
          - recover-r148-homeos-init
      authorization:
        description: Exact operation-specific authorization
        required: true
        type: choice
        default: NO
        options:
          - NO
          - AUTHORIZE_R148_HOMEOS_INIT_FORWARD_RECOVERY_V1

permissions:
  contents: read

concurrency:
  group: stay-r150-r148-homeos-init-forward-recovery-v25
  cancel-in-progress: false

env:
  RELEASE_TAG: r150-homeos-intero-shadow-v22
  RELEASE_TAG_OBJECT: c6570c7f37acb495a92095729ac56c895a514f1c
  RELEASE_COMMIT: 1a2ff66909dd5eb065e08ca807a13e8ec5951c51
  RELEASE_TREE: f05af36c697a4c0f48892e51d83ff4139369e088
  ARCHIVE: STAY_P1_R150_HOMEOS_INTERO_SHADOW_V22_BUNDLE_20260905.tar.gz
  ARCHIVE_SHA256: 56942c3982d99aee293c09f882ba4d15c58a249fe81f4159d588eea2a2d7a031
  SIDECAR_SHA256: f7eb8d227106d60aac3d9c637d175eab06ec748031720dca8662a400c572db67
  MANIFEST_SHA256: c1651b9150bc5c14d254d86caa60cb267317301c01c95282929fc696f4c6160b
  FORWARD_SHA256: 98d2a340d23f01e3e2c4fd9f0c7d0a86f60bc220027d015581f63120992f143c
  RECOVERY_SHA256: 1cd30b887134a6b4ad6257ce630cd57a763b49527e4f92ec3152cfd41c18c369
  PREVIOUS_RELEASE: /opt/stay/releases/0.8.11.3-p1r0-r150-homeos-intero-3aa588159412
  TARGET_RELEASE: /opt/stay/releases/0.8.11.3-p1r0-r150-homeos-intero-c1651b9150bc
  WRAPPER_SHA256: 6f948c132325352469a51b1248d53292d98f7cdaad32c6a26d31aabbebcc1f64
  PUBLIC_KEY_SHA256: f02405d0f62529c35f34c43c0a349f88c7906aa460ce36111585577b119457dc
  PRODUCTION_PUBLIC_IPV4: 35.157.242.167
  PRODUCTION_PRIVATE_IPV4: 172.26.9.207
  PRODUCTION_SSH_ED25519_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBvxednOQ0VcQL1KR0MewyXFCqufbwWsg0Lkgg/MwMUS
  PRODUCTION_SSH_ED25519_FINGERPRINT: SHA256:z0aBq4eHfQpARjsa7pfpL2spIVi62lqwx54mlm9XU8Q

jobs:
  validate-immutable-release:
    name: Revalidate immutable release and real entry paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate fixed dispatch
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$OPERATION" == recover-r148-homeos-init ]]
          [[ "$AUTHORIZATION" == AUTHORIZE_R148_HOMEOS_INIT_FORWARD_RECOVERY_V1 ]]
      - name: Checkout exact certified release
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false
          path: release-source
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install real OS sandbox
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo tee /usr/local/bin/stay-ci-bwrap >/dev/null <<'EOF'
          #!/bin/sh
          exec sudo -n /usr/bin/bwrap "$@"
          EOF
          sudo chown root:root /usr/local/bin/stay-ci-bwrap
          sudo chmod 0755 /usr/local/bin/stay-ci-bwrap
          sudo -n true
      - name: Download and validate hosted immutable archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/r150-v22-release"; extract="$root/extract"
          install -d -m 0700 "$root" "$extract"
          [[ "$(git -C release-source rev-parse HEAD)" == "$RELEASE_COMMIT" ]]
          [[ "$(git -C release-source rev-parse HEAD^{tree})" == "$RELEASE_TREE" ]]
          read -r ref_type ref_sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type + " " + .object.sha')
          [[ "$ref_type" == tag && "$ref_sha" == "$RELEASE_TAG_OBJECT" ]]
          read -r target_type target_sha < <(gh api "repos/$GITHUB_REPOSITORY/git/tags/$RELEASE_TAG_OBJECT" --jq '.object.type + " " + .object.sha')
          [[ "$target_type" == commit && "$target_sha" == "$RELEASE_COMMIT" ]]
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE" --pattern "$ARCHIVE.sha256" --dir "$root"
          [[ "$(sha256sum "$root/$ARCHIVE" | awk '{print $1}')" == "$ARCHIVE_SHA256" ]]
          [[ "$(sha256sum "$root/$ARCHIVE.sha256" | awk '{print $1}')" == "$SIDECAR_SHA256" ]]
          (cd "$root" && sha256sum -c "$ARCHIVE.sha256")
          mapfile -t entries < <(tar -tzf "$root/$ARCHIVE")
          [[ "${#entries[@]}" -eq 109 && "$(printf '%s\n' "${entries[@]}" | sort -u | wc -l)" -eq 109 ]]
          for entry in "${entries[@]}"; do
            [[ -n "$entry" && "$entry" != /* && ! "$entry" =~ (^|/)\.\.(/|$) && "$entry" != *\\* && ! "$entry" =~ ^[A-Za-z]: ]]
          done
          tar -tvzf "$root/$ARCHIVE" | awk 'substr($1,1,1)!~/[-d]/{bad=1}END{exit bad}'
          tar -xzf "$root/$ARCHIVE" -C "$extract"
          manifest='deploy/live-physiology-transplant/P1_PRODUCTION_HARDENING_R141F_TO_R150.sha256'
          [[ "$(find "$extract" -type f | wc -l)" -eq 87 ]]
          [[ "$(wc -l < "$extract/$manifest")" -eq 86 ]]
          [[ "$(sha256sum "$extract/$manifest" | awk '{print $1}')" == "$MANIFEST_SHA256" ]]
          [[ "$(sha256sum "$extract/deploy/live-physiology-transplant/p1-r150-homeos-intero-forward.sh" | awk '{print $1}')" == "$FORWARD_SHA256" ]]
          [[ "$(sha256sum "$extract/deploy/live-physiology-transplant/p1-r150-homeos-intero-forward-recovery.sh" | awk '{print $1}')" == "$RECOVERY_SHA256" ]]
          (cd "$extract" && sha256sum -c "$manifest")
          { awk '{sub(/^\.\//,"",$2);print $2}' "$extract/$manifest"; echo "$manifest"; } | sort >"$root/expected"
          (cd "$extract" && find . -type f -printf '%P\n' | sort) >"$root/actual"
          cmp "$root/expected" "$root/actual"
          while IFS= read -r file; do
            case "$file" in *.js) node --check "$extract/$file" >/dev/null ;; *.sh) bash -n "$extract/$file" ;; esac
            cmp "$extract/$file" "release-source/$file"
          done <"$root/actual"
          cat >"$root/P1_R150_RELEASE.identity" <<EOF
          RELEASE_TAG=$RELEASE_TAG
          RELEASE_TAG_OBJECT=$RELEASE_TAG_OBJECT
          RELEASE_COMMIT=$RELEASE_COMMIT
          RELEASE_TREE=$RELEASE_TREE
          ARCHIVE=$ARCHIVE
          ARCHIVE_SHA256=$ARCHIVE_SHA256
          SIDECAR_SHA256=$SIDECAR_SHA256
          MANIFEST_SHA256=$MANIFEST_SHA256
          FORWARD_SHA256=$FORWARD_SHA256
          RECOVERY_SHA256=$RECOVERY_SHA256
          TARGET_RELEASE=$TARGET_RELEASE
          EOF
      - name: Run focused regressions and real Bubblewrap entry
        shell: bash
        working-directory: release-source
        run: |
          set -euo pipefail
          STAY_BWRAP=/usr/local/bin/stay-ci-bwrap STAY_REQUIRE_OS_CORE_SANDBOX=1 node --disable-sigusr1 --test --test-isolation=none --test-concurrency=1 test/p1-r147-continuation-recovery.test.js test/p1-r148-homeos-init-forward-recovery.test.js test/p1-r150-production-gates.test.js
      - name: Upload independently validated release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r150-v22-validated-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r150-v22-release/${{ env.ARCHIVE }}
            ${{ runner.temp }}/r150-v22-release/${{ env.ARCHIVE }}.sha256
            ${{ runner.temp }}/r150-v22-release/P1_R150_RELEASE.identity
          if-no-files-found: error
          retention-days: 7

  production-transition:
    name: Exact stopped-state preflight and pinned recovery
    needs: validate-immutable-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Download validated release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: r150-v22-validated-release-${{ github.run_id }}
          path: release-assets
      - name: Reverify isolated deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          expected=$'P1_R150_RELEASE.identity\n'"$ARCHIVE"$'\n'"$ARCHIVE.sha256"
          [[ "$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)" == "$expected" ]]
          [[ "$(sha256sum "release-assets/$ARCHIVE" | awk '{print $1}')" == "$ARCHIVE_SHA256" ]]
          [[ "$(sha256sum "release-assets/$ARCHIVE.sha256" | awk '{print $1}')" == "$SIDECAR_SHA256" ]]
          (cd release-assets && sha256sum -c "$ARCHIVE.sha256")
      - name: Prepare pinned production SSH identity
        shell: bash
        env:
          STAY_DEPLOY_KEY: ${{ secrets.STAY_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$STAY_DEPLOY_KEY" >~/.ssh/stay_deploy
          chmod 0600 ~/.ssh/stay_deploy
          printf '%s %s\n' "$PRODUCTION_PUBLIC_IPV4" "$PRODUCTION_SSH_ED25519_KEY" >~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
          [[ "$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')" == "$PRODUCTION_SSH_ED25519_FINGERPRINT" ]]
      - name: Exact read-only R148 production preflight
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(-i ~/.ssh/stay_deploy -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" staydeploy@"$PRODUCTION_PUBLIC_IPV4" 'bash -s' -- "$PRODUCTION_PRIVATE_IPV4" "$WRAPPER_SHA256" "$PUBLIC_KEY_SHA256" "$PREVIOUS_RELEASE" <<'REMOTE'
          set -Eeuo pipefail
          expected_ip="$1"; wrapper_sha="$2"; public_sha="$3"; previous="$4"
          observed="$(ip -o -4 addr show scope global | awk '{a=$4;sub(/\/.*/,"",a);print a}' | sort -u)"
          [[ "$observed" == "$expected_ip" && "$(readlink -f /opt/stay/current)" == "$previous" ]]
          [[ "$(sha256sum /usr/local/sbin/stay-p1-production-controller | awk '{print $1}')" == "$wrapper_sha" ]]
          [[ "$(sha256sum /etc/stay/p1-r0-expansion-birth-authority.pub | awk '{print $1}')" == "$public_sha" ]]
          [[ "$(systemctl show stay.service -p ActiveState --value)" == inactive && "$(systemctl show stay.service -p SubState --value)" == dead && "$(systemctl show stay.service -p MainPID --value)" == 0 && "$(systemctl show stay.service -p NRestarts --value)" == 0 && "$(systemctl show stay.service -p Result --value)" == success && "$(systemctl is-active stay-physiology-benchmark-v3.service 2>/dev/null || true)" == inactive ]]
          node - /var/lib/stay/data/continuity.sqlite3 <<'NODE'
          'use strict';const crypto=require('node:crypto'),{DatabaseSync}=require('node:sqlite'),db=new DatabaseSync(process.argv[2],{open:true,readOnly:true});try{db.exec('PRAGMA query_only=ON;BEGIN');const q=String(db.prepare('PRAGMA quick_check').get()?.quick_check||'').toLowerCase(),r=db.prepare("SELECT json,sha256 FROM metadata WHERE key='life:runtime-revision'").get(),rev=JSON.parse(r.json),valid=crypto.createHash('sha256').update(r.json).digest('hex')===r.sha256,count=(t,w)=>Number(db.prepare(`SELECT COUNT(*) value FROM ${t} WHERE ${w}`).get().value),pending=count('biological_deliveries',"status='PENDING'"),failed=count('biological_deliveries',"status='FAILED'"),abandoned=count('biological_deliveries',"status='ABANDONED'"),outbox=count('biological_outbox_intents',"status='PENDING'"),authority=count('authority',"core_id IN ('sntss','chronobiology','METAB','HOMEOS','INTERO')"),highWater=Number(db.prepare('SELECT COALESCE(MAX(sequence),0) value FROM biological_events').get().value);if(!(q==='ok'&&valid&&rev.revision===148&&r.sha256==='95006d1bb78a323e580b6596fa6c91a955f079b72068662b5f47c3a6d0158c9c'&&pending===160&&failed===0&&abandoned===0&&outbox===2&&authority===0&&highWater===4575680))process.exit(1);process.stdout.write('R148_STOPPED_DB_PREFLIGHT=PASS\n');}finally{db.close();}
          NODE
          printf 'R150_READ_ONLY_PREFLIGHT=PASS\nRUNTIME_REVISION=148\nSERVICE_STATE=inactive/dead\nBENCHMARK_ACTIVE=NO\n'
          REMOTE
      - name: Stage and invoke only the pinned root controller
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          set -euo pipefail
          run_root="/opt/stay/incoming/r150-controller-v25-${GITHUB_RUN_ID}"
          ssh_options=(-i ~/.ssh/stay_deploy -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${ssh_options[@]}" staydeploy@"$PRODUCTION_PUBLIC_IPV4" "set -euo pipefail; test ! -e '$run_root'; install -d -m 0700 '$run_root'; chmod u-s,g-s '$run_root'; chmod 0700 '$run_root'"
          scp "${ssh_options[@]}" release-assets/"$ARCHIVE" release-assets/"$ARCHIVE.sha256" release-assets/P1_R150_RELEASE.identity staydeploy@"$PRODUCTION_PUBLIC_IPV4":"$run_root/"
          ssh "${ssh_options[@]}" staydeploy@"$PRODUCTION_PUBLIC_IPV4" 'bash -s' -- "$run_root" <<'REMOTE'
          set -euo pipefail
          root="$1"
          [[ "$root" =~ ^/opt/stay/incoming/r150-controller-v25-[0-9]+$ && -d "$root" && ! -L "$root" ]]
          chmod u-s,g-s "$root"; chmod 0700 "$root"
          [[ "$(stat -Lc '%U:%G:%a' "$root")" == staydeploy:staydeploy:700 ]]
          [[ "$(find "$root" -maxdepth 1 -type f | wc -l)" -eq 3 ]]
          [[ -z "$(find -P "$root" -xdev \( -type l -o ! -type f ! -type d -o ! -user staydeploy -o ! -group staydeploy \) -print -quit)" ]]
          find -P "$root" -xdev -type f -exec chmod 0400 {} +
          [[ -z "$(find -P "$root" -xdev -type f ! -perm 0400 -print -quit)" ]]
          REMOTE
          set +e
          ssh "${ssh_options[@]}" staydeploy@"$PRODUCTION_PUBLIC_IPV4" sudo -n /usr/local/sbin/stay-p1-production-controller "$OPERATION" "$run_root" "$AUTHORIZATION" NONE NONE 2>&1 | tee controller.output
          statuses=("${PIPESTATUS[@]}"); set -e
          [[ "${statuses[0]}" -eq 0 && "${statuses[1]}" -eq 0 ]]
          grep -Fx 'R148_HOMEOS_INIT_FORWARD_RECOVERY=PASS' controller.output
          grep -Fx 'R150_CONTROLLER_STAGE=homeos-r148-recovery' controller.output
          grep -Fx 'R150_CONTROLLER_REVISION=R148F' controller.output
          grep -Fx 'R150_CONTROLLER_RESULT=PASS' controller.output
          grep -Fx 'R150_CONTROLLER_FAILURE_CLASS=NONE' controller.output
          grep -Fx 'R150_CONTROLLER_CLEANUP_STATUS=PASS' controller.output
          grep -Fx 'P1_AUTHORITY=NONE' controller.output
          grep -Fx 'FETUS_CONTINUITY=PASS' controller.output
          grep -Fx 'INTERO=ABSENT' controller.output
          grep -Fx 'BENCHMARK_ACTIVE=NO' controller.output
          grep -Fx "CURRENT_RELEASE=$TARGET_RELEASE" controller.output
          code="$(curl --silent --output public.html --write-out '%{http_code}' --max-time 5 "http://$PRODUCTION_PUBLIC_IPV4/")"
          [[ "$code" == 200 && -s public.html ]]; ! grep -Fqi '502 Bad Gateway' public.html
          printf 'PUBLIC_ENTRY_HTTP=%s\nBENCHMARK_ACTIVE=NO\n' "$code"
      - name: Upload sanitized controller evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r150-r148-controller-output-${{ github.run_id }}
          path: |
            controller.output
            public.html
          if-no-files-found: warn
          retention-days: 14
